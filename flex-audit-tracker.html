  button{font-family:inherit;}
  button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  button:disabled{opacity:.55;cursor:not-allowed;}
  .shell{display:flex;align-items:stretch;min-height:100vh;}
  .sidebar{
    width:230px;
    flex-shrink:0;
    background:var(--card);
    border-right:1px solid var(--line);
    padding:24px 0;
    position:sticky;
    top:0;
    align-self:flex-start;
    height:100vh;
    overflow-y:auto;
  }
  .sidebar-title{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--muted);
    font-weight:700;
    padding:0 20px 10px;
  }
  .sidebar-item{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    border-left:3px solid transparent;
    padding:11px 20px;
    font-size:15px;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
  }
  .sidebar-item .dot{width:7px;height:7px;border-radius:50%;background:var(--control-line);flex-shrink:0;}
  .sidebar-item.has-detail .dot{background:var(--accent);}
  .sidebar-item:hover{background:var(--bg);}
  .sidebar-item.active{background:var(--verified-bg);border-left-color:var(--accent);color:var(--accent-dark);}
  .sidebar-item.setup-item{color:var(--accent-dark);}
  .sidebar-item.edit-toggle{color:var(--accent-dark);}
  .sidebar-divider{height:1px;background:var(--line);margin:12px 20px;}
  .main-scroll{flex:1;min-width:0;padding:32px 20px 100px;}
  .wrap{max-width:880px;margin:0 auto;}
  .page-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    padding-bottom:12px;
    flex-wrap:wrap;
    gap:12px;
  }
  .page-header h1{font-size:26px;margin:0;font-weight:700;letter-spacing:-0.01em;}
  .sub{font-size:14px;color:var(--muted);font-weight:600;margin-top:4px;}
  .week-nav{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
  .week-nav-row{display:flex;align-items:center;gap:8px;}
  .week-arrow{
    font-size:18px;
    font-weight:600;
    background:var(--card);
    border:1px solid var(--control-line);
    color:var(--ink);
    width:40px;
    height:40px;
    border-radius:50%;
    cursor:pointer;
    line-height:1;
  }
  .week-arrow:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
  .week-badge{
    font-size:15px;
    font-weight:700;
    background:var(--ink);
    color:#fff;
    padding:9px 16px;
    border-radius:20px;
    white-space:nowrap;
    min-width:96px;
    text-align:center;
  }
  .week-dates{font-size:14px;color:var(--muted);font-weight:600;}
  .this-week-tag{color:var(--pass);font-weight:700;}
  .link-btn{
    background:none;
    border:none;
    padding:0;
    font:inherit;
    font-weight:600;
    color:var(--accent-dark);
    text-decoration:underline;
    cursor:pointer;
  }
  .toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    margin:4px 0 18px;
  }
  .toolbar-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;}
  .pass-note{font-size:14px;color:var(--muted);font-weight:600;}
  .recording-as{font-size:14px;color:var(--muted);}
  .recording-as strong{color:var(--ink);}
  .name-missing{color:var(--warn-ink);background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:8px;padding:6px 10px;}
  .stat-row{display:flex;gap:10px;margin-bottom:16px;}
  .stat-card{
    flex:1;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
  }
  .stat-n{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;}
  .stat-l{font-size:13px;color:var(--muted);font-weight:600;margin-top:2px;}
  .stat-sub{font-size:13px;color:var(--fail);font-weight:600;margin-top:2px;}
  .stat-sub.ok{color:var(--pass);}
  .a-row{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:8px;
  }
  .a-row.fixed{background:#fafbfc;}
  .a-avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    background:var(--accent);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:700;
    flex-shrink:0;
  }
  .a-row.fixed .a-avatar{background:var(--ink);}
  .a-body{flex:1;min-width:0;}
  .a-name{font-size:16px;font-weight:700;}
  .a-fixed-tag{font-weight:400;color:var(--muted);font-size:14px;}
  .a-audit{font-size:15px;color:var(--ink);margin-top:2px;}
  .a-stamp{font-size:13px;color:var(--muted);margin-top:4px;}
  .a-cover{font-size:14px;color:var(--accent);margin-top:4px;}
  .a-chip.reassign-btn{border-style:dashed;}
  .h-cover{font-weight:400;color:var(--accent);font-size:13px;}
  .history-year{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:10px 4px;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer;}
  .history-year-count{font-weight:400;color:var(--muted);font-size:14px;}
  .modal-actions .undo-reassign{margin-right:auto;}
  .a-chips{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
  .a-chip{
    font-size:14px;
    font-weight:600;
    padding:8px 14px;
    border-radius:20px;
    border:1px solid var(--control-line);
    color:var(--ink);
    background:var(--card);
    cursor:pointer;
    transition:background-color .12s ease,border-color .12s ease,color .12s ease;
  }
  .a-chip:hover{border-color:var(--ink);}
  .a-chip.on.pass{background:var(--pass-bg);color:var(--pass);border-color:var(--pass);}
  .a-chip.on.fail{background:var(--fail-bg);color:var(--fail);border-color:var(--fail);}
  .a-chip.on.verified{background:var(--verified-bg);color:var(--verified);border-color:var(--verified);}
  .a-chip.on.corrected{background:var(--pass-bg);color:var(--pass);border-color:var(--pass);}
  .a-chip.correct-btn:not(.on){border-color:var(--fail);color:var(--fail);border-style:dashed;}
  .a-chip.on::before{content:"\2713  ";}
  .a-chip.note-btn{border-style:dashed;}
  .a-chip.note-btn.has-note{border-style:solid;background:var(--accent);color:#fff;border-color:var(--accent);}
  .panel-heading{font-size:15px;font-weight:700;margin:0 0 10px;}
  .card-panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:4px 16px;
  }
  .alert-section{margin-bottom:16px;}
  .card-panel.flags-panel{border-color:var(--fail);background:var(--fail-bg);}
  .flags-heading{color:var(--fail);}
  .card-panel.overdue-panel{border-color:var(--warn-line);background:var(--warn-bg);}
  .overdue-heading{color:var(--warn-ink);}
  .panel-intro{font-size:14px;color:var(--ink);padding:12px 0 4px;margin:0;}
  .flag-item{padding:12px 0;border-bottom:1px solid rgba(180,35,35,.25);}
  .overdue-panel .flag-item{border-bottom-color:rgba(92,67,0,.2);}
  .flag-item:last-child{border-bottom:none;}
  .flag-id{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-weight:700;font-size:15px;}
  .flag-occurrences{font-size:14px;color:var(--ink);margin-top:3px;line-height:1.6;}
  .legend{margin-top:36px;}
  .legend-item{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
  .legend-item:last-child{border-bottom:none;}
  .legend-text{flex:1;}
  .legend-name{font-weight:700;font-size:15px;}
  .legend-detail{font-size:14px;color:var(--muted);margin-top:4px;white-space:pre-wrap;line-height:1.55;}
  .legend-empty,.muted-italic{font-style:italic;color:var(--muted);}
  .edit-btn{
    flex-shrink:0;
    font-size:14px;
    font-weight:600;
    background:var(--card);
    color:var(--accent-dark);
    border:1px solid var(--accent);
    border-radius:20px;
    padding:6px 14px;
    cursor:pointer;
  }
  .edit-btn:hover{background:var(--verified-bg);}
  .history{margin-top:36px;}
  .history-block{padding:10px 0;border-bottom:1px solid var(--line);}
  .history-block:last-child{border-bottom:none;}
  .history-week{
    background:none;
    border:none;
    padding:4px 0;
    font:inherit;
    font-size:15px;
    font-weight:700;
    color:var(--accent-dark);
    text-decoration:underline;
    cursor:pointer;
    text-align:left;
  }
  .history-row{display:flex;justify-content:space-between;font-size:14px;gap:10px;padding:5px 0;}
  .history-row .h-person{font-weight:600;min-width:90px;}
  .history-row .h-audit{color:var(--muted);flex:1;}
  .h-result{font-size:13px;font-weight:700;}
  .h-result.pass{color:var(--pass);}
  .h-result.fail{color:var(--fail);}
  .h-result.pending{color:var(--muted);}
  .h-verified{color:var(--verified);}
  .h-corrected{color:var(--pass);}
  .h-uncorrected{color:var(--fail);}
  .a-stamp.uncorrected{color:var(--fail);font-weight:600;}
  .rates{margin-top:36px;}
  .rates-scroll{overflow-x:auto;}
  .rates-table{width:100%;border-collapse:collapse;font-size:14px;margin:4px 0;}
  .rates-table th{text-align:left;font-size:13px;color:var(--muted);font-weight:700;padding:10px 8px 8px 0;border-bottom:1px solid var(--line);}
  .rates-table td{padding:9px 8px 9px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;}
  .rates-table tr:last-child td{border-bottom:none;}
  .rates-table .num{text-align:right;}
  .rates-table td.rate-low{color:var(--fail);font-weight:700;}
  .h-note{font-size:14px;color:var(--muted);margin:2px 0 4px;}
  .h-pending{font-size:14px;color:var(--muted);font-style:italic;padding-top:4px;}
  .history-more{margin:12px 0 4px;}
  .walkthrough-panel{margin-top:16px;padding:20px;}
  .walkthrough-body{font-size:16px;line-height:1.65;white-space:pre-wrap;}
  .walkthrough-panel textarea{
    width:100%;
    min-height:320px;
    border:1px solid var(--control-line);
    border-radius:8px;
    padding:12px;
    font-family:inherit;
    font-size:16px;
    line-height:1.6;
    color:var(--ink);
    resize:vertical;
  }
  .walkthrough-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;}
  .walkthrough-image-label{font-size:14px;color:var(--muted);font-weight:700;margin:20px 0 10px;}
  .walkthrough-image{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;}
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(27,36,48,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
  }
  .modal-box{
    background:var(--card);
    max-width:520px;
    width:100%;
    max-height:calc(100vh - 40px);
    overflow-y:auto;
    border-radius:12px;
    padding:24px;
    box-shadow:0 20px 50px rgba(20,30,50,.2);
    animation:modal-in .15s ease;
  }
  @keyframes modal-in{
    from{opacity:0;transform:translateY(8px) scale(.98);}
    to{opacity:1;transform:none;}
  }
  .modal-box h3{margin:0 0 4px;font-size:19px;font-weight:700;}
  .modal-sub{font-size:14px;color:var(--muted);font-weight:600;margin-bottom:16px;}
  .modal-narrow{max-width:400px;}
  .modal-help{font-size:15px;line-height:1.5;margin:0 0 14px;}
  .field-label{display:block;font-size:14px;font-weight:700;color:var(--ink);margin-bottom:6px;}
  .field-hint{font-size:13px;color:var(--muted);margin:-8px 0 12px;}
  .modal-input{
    width:100%;
    border:1px solid var(--control-line);
    border-radius:8px;
    padding:10px 12px;
    font-family:inherit;
    font-size:16px;
    color:var(--ink);
    background:var(--card);
    margin-bottom:14px;
  }
  .modal-input.input-error{border-color:var(--fail);border-width:2px;}
  .modal-box textarea{
    width:100%;
    min-height:140px;
    border:1px solid var(--control-line);
    border-radius:8px;
    padding:10px 12px;
    font-family:inherit;
    font-size:16px;
    color:var(--ink);
    resize:vertical;
  }
  .pin-input{font-size:24px;letter-spacing:0.3em;text-align:center;margin-bottom:6px;}
  .field-error{color:var(--fail);font-size:14px;font-weight:600;margin:-8px 0 12px;}
  .field-error:empty{display:none;}
  .pin-input ~ .field-error{margin:4px 0 0;}
  .match-warning:empty{display:none;}
  .match-warning{
    background:var(--fail-bg);
    border:1px solid var(--fail);
    color:var(--ink);
    border-radius:8px;
    padding:10px 12px;
    font-size:14px;
    margin:-4px 0 14px;
  }
  .match-warning strong{color:var(--fail);}
  .match-warning ul{margin:6px 0 0;padding-left:18px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .modal-confirm{
    margin-top:16px;
    background:var(--warn-bg);
    border:1px solid var(--warn-line);
    color:var(--warn-ink);
    border-radius:8px;
    padding:12px;
    font-size:15px;
  }
  .modal-confirm .modal-actions{margin-top:10px;}
  .remove-list{margin:0 0 14px;padding-left:20px;font-size:15px;line-height:1.6;}
  .btn-primary,.btn-ghost,.btn-danger{
    font-size:15px;
    font-weight:600;
    border-radius:20px;
    padding:10px 20px;
    cursor:pointer;
  }
  .btn-primary{background:var(--accent);color:#fff;border:1px solid var(--accent);}
  .btn-primary:hover:not(:disabled){background:var(--accent-dark);}
  .btn-ghost{background:var(--card);color:var(--ink);border:1px solid var(--control-line);}
  .btn-ghost:hover:not(:disabled){border-color:var(--ink);}
  .btn-danger{background:var(--fail);color:#fff;border:1px solid var(--fail);}
  .btn-danger:hover:not(:disabled){background:#8f1b1b;}
  .btn-danger-outline{background:var(--card);color:var(--fail);border:1px solid var(--fail);}
  .btn-danger-outline:hover:not(:disabled){background:var(--fail-bg);}
  .btn-small{font-size:14px;padding:7px 14px;}
  .edit-banner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    background:var(--warn-bg);
    border:1px solid var(--warn-line);
    color:var(--warn-ink);
    border-radius:10px;
    padding:10px 14px;
    margin-bottom:18px;
    font-size:15px;
  }
  .setup-intro{font-size:16px;line-height:1.55;margin:0 0 20px;}
  .setup-section{padding:18px 20px;margin-bottom:16px;}
  .setup-section h2{font-size:18px;margin:0 0 6px;}
  .setup-help{font-size:15px;color:var(--muted);line-height:1.5;margin:0 0 14px;}
  .list-row-wrap{margin-bottom:8px;}
  .list-row{display:flex;align-items:center;gap:8px;}
  .list-row .modal-input{margin-bottom:0;flex:1;min-width:0;}
  .list-row-wrap .field-error{margin:4px 0 0 36px;}
  .list-num{width:28px;text-align:right;font-size:14px;font-weight:700;color:var(--muted);flex-shrink:0;}
  .icon-btn{
    width:40px;
    height:40px;
    flex-shrink:0;
    border:1px solid var(--control-line);
    background:var(--card);
    border-radius:8px;
    font-size:17px;
    color:var(--ink);
    cursor:pointer;
  }
  .icon-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
  .add-btn{margin-top:6px;}
  .list-empty{display:block;font-size:15px;margin:4px 0 8px;}
  .count-warning,.date-warning{
    background:var(--warn-bg);
    border:1px solid var(--warn-line);
    color:var(--warn-ink);
    border-radius:8px;
    padding:10px 12px;
    font-size:15px;
    line-height:1.5;
    margin-bottom:14px;
  }
  .date-input{max-width:240px;}
  .backup-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .backup-status{font-size:14px;color:var(--muted);}
  .file-input{font-size:15px;margin-bottom:10px;}
  .setup-actions{
    position:sticky;
    bottom:0;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:10px;
    flex-wrap:wrap;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 16px;
    box-shadow:0 -6px 20px rgba(20,30,50,.08);
  }
  .setup-status{flex:1;font-size:15px;color:var(--muted);}
  .setup-status.dirty{color:var(--warn-ink);font-weight:600;}
  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    color:#fff;
    font-size:15px;
    padding:12px 22px;
    border-radius:20px;
    opacity:0;
    transition:opacity .25s ease;
    pointer-events:none;
    max-width:calc(100vw - 32px);
    text-align:center;
    z-index:150;
  }
  .toast.show{opacity:1;}
  body:has(.setup-actions) .toast{bottom:100px;}
  .error-bar{
    position:fixed;
    left:50%;
    top:16px;
    transform:translateX(-50%);
    width:min(640px, calc(100vw - 32px));
    background:var(--fail);
    color:#fff;
    border-radius:10px;
    padding:14px 16px;
    display:flex;
    gap:14px;
    align-items:flex-start;
    font-size:15px;
    line-height:1.45;
    box-shadow:0 10px 30px rgba(20,30,50,.25);
    z-index:200;
  }
  .error-bar[hidden]{display:none;}
  .error-bar span{flex:1;}
  .error-bar button{background:#fff;color:var(--fail);border:none;border-radius:20px;padding:6px 14px;font-weight:700;font-size:14px;cursor:pointer;}
  .loading{color:var(--muted);font-size:15px;padding:40px 0;text-align:center;}
  .fatal{background:var(--card);border:1px solid var(--fail);border-radius:10px;padding:20px;font-size:16px;line-height:1.55;}
  #printArea{display:none;}
  @media (max-width:720px){
    .shell{flex-direction:column;}
    .sidebar{
      width:100%;
      height:auto;
      position:static;
      display:flex;
      flex-wrap:wrap;
      gap:4px;
      padding:10px;
      border-right:none;
      border-bottom:1px solid var(--line);
    }
    .sidebar-title,.sidebar-divider{display:none;}
    .sidebar-item{
      width:auto;
      border-left:none;
      border:1px solid var(--line);
      border-radius:20px;
      padding:8px 14px;
      font-size:14px;
    }
    .sidebar-item .dot{display:none;}
    .sidebar-item.active{border-color:var(--accent);}
    .week-nav{align-items:flex-start;}
  }
  @media (max-width:1100px){
    .a-row{flex-wrap:wrap;}
    .a-chips{width:100%;justify-content:flex-start;}
  }
  @media (max-width:520px){
    .stat-row{flex-wrap:wrap;}
    .list-row{flex-wrap:wrap;}
    .list-row .modal-input{flex-basis:calc(100% - 36px);}
    .list-row .list-num + .modal-input ~ *{margin-top:6px;}
  }
  @media print{
    body{background:#fff;font-size:12pt;}
    body::before,.shell,.toast,.error-bar,#modalRoot{display:none !important;}
    #printArea{display:block;color:#000;}
    #printArea h1{font-size:18pt;margin:0;}
    #printArea h2{font-size:14pt;margin:14pt 0 8pt;}
    #printArea table{width:100%;border-collapse:collapse;font-size:10.5pt;}
    #printArea th,#printArea td{border:1px solid #555;padding:5pt 6pt;text-align:left;vertical-align:top;}
    #printArea th{background:#eee;}
    #printArea .print-sign{margin-top:30pt;display:flex;gap:40pt;}
    #printArea .print-sign div{flex:1;border-top:1px solid #000;padding-top:4pt;}
    #printArea .print-meta{font-size:10pt;color:#333;margin-top:16pt;}
  }
</style>
</head>
<body>
<div class="shell">
  <nav class="sidebar" id="sidebar" aria-label="Main menu"></nav>
  <main class="main-scroll">
    <div class="wrap" id="mainContent"><div class="loading">Loading tracker…</div></div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="error-bar" id="errorBar" role="alert" hidden><span id="errorText"></span><button type="button" id="errorExport" data-action="export-raw" hidden>Download a Copy of My Data</button><button type="button" data-action="dismiss-error">Dismiss</button></div>
<div id="modalRoot"></div>
<div id="printArea"></div>

  { slot: "0", name: "Bold Status", detail: "Check Avionte Bold to ensure the associate's status is accurate. If they are actively working it should read On Assignment. If it does not say that, change it. If they are termed but showing as On Assignment, it needs to be changed to Active or Inactive depending on if they are actively looking for work.", sop: "1. Log into Avionte Bold and navigate to the Analyze tab at the top of the screen.\n2. Select the report titled Active Consultants.\n3. In the sidebar, select Company and choose Flex.\n4. Select Date Range and choose Today.\n5. Make sure that in your filters, Talent Status is selected.\n6. Review all the talent statuses. All should say On Assignment.\n7. If they do not, change that associate's status to the right one:\n   - Still employed at Flex → On Assignment\n   - No longer employed at Flex, still looking for work → Active\n   - No longer employed at Flex, found a job elsewhere or not returning → Inactive\n8. To change the status: go into the associate's profile, hover your mouse over their picture in the top left, and select the edit button (looks like a pencil and notepad). Choose Talent Status, change the status, and click the blue save icon when finished.\n9. In the Audit Tracker, enter the Bold ID of each associate you changed and enter notes describing what was completed." },
  { slot: "0", name: "EAD", detail: "Check the work permit (EAD) on file in the Avionte Bold Certificates tab for every actively working associate at Flex. If it expires in the next 30 days, notify the associate and collect new documentation. If it has already expired, we must collect a new one within 3 days or remove them from the assignment — check with the Onsite Manager first, because some work permits are automatically extended. Upload the new document to Certificates and update the certificate's required fields. Tip: the Expiring Certificates widget on your Avionte Bold My Dashboard page shows expiring and already-expired EADs for all of YES.", sop: "Shortcut — Expiring Certificates widget (set up once):\n- In Avionte Bold, go to your My Dashboard page.\n- At the top of the page, click Add Widget.\n- Click the green plus sign next to Expiring Certificates.\n- The widget stays on your dashboard from then on. It shows EADs that are expiring and ones that have already expired for all of YES, so look for the Flex associates on it.\nUse the widget to quickly spot who needs follow-up, then work through the steps below.\n\n1. Log into Avionte Bold and navigate to the Analyze tab at the top of the screen.\n2. Select the report titled Active Consultants.\n3. In the sidebar, select Company and choose Flex.\n4. Select Date Range and choose Today.\n5. Open each associate's profile and go to the Certificates tab. View the work permit (EAD) on file and its expiration date.\n6. Important — do NOT ask for new documents from:\n   - U.S. citizens\n   - Permanent residents (green card holders), even if the green card itself is expiring\n   - Anyone whose only expiring document is a List B ID, like a driver's license\n   Asking these associates for new documents is not allowed.\n7. If the work permit is close to expiring (within the next 30 days), notify the associate and collect new documentation before it expires. They may show any unexpired document from List A or List C (see the I-9 list of acceptable documents) — do not ask for a specific one.\n8. If the work permit has already expired, we need to collect a new one within 3 days. Tell the Onsite Manager right away. Some work permits are automatically extended (the associate may have a Form I-797C receipt notice), so check with the Onsite Manager before removing anyone. If we still do not have a valid document 3 days after the old one expires, the associate must be removed from the assignment.\n9. Once you have the new document:\n   - Upload it to the associate's Certificates tab.\n   - Edit the certificate: add the new document and update the required fields (like the expiration date) to match the new document.\n   - Complete Supplement B (the reverification page of the I-9) after looking at the original document.\n10. In the Audit Tracker, enter the Bold ID of each associate you followed up with and note the expiration date and what was done." },
  { slot: "0", name: "Audit Core HR Report", detail: "Run the Core HR - Contingent Worker Details report from Workday and make sure every Flex associate's job details are accurate: Light Industrial code, work area, primary org, agency, work shift, wage, pay frequency, supervisor, markup, and Contingent Kronos ID area. Compare supervisor, shift, and department against the Req Tracker / Flex Q; the rest should match the standard values for the Flex account. Correct anything that is wrong or blank in Workday.", sop: "1. In Workday, run the Core HR - Contingent Worker Details report. (This is the same report used for the Headcount Accuracy audit.)\n2. Export it to Excel so you can sort and filter the columns.\n3. For every associate on the report, check that each of these is accurate and not blank:\n   - Light Industrial code\n   - Work area\n   - Primary org\n   - Agency\n   - Work shift\n   - Wage\n   - Pay frequency\n   - Supervisor\n   - Markup\n   - Contingent Kronos ID area\n4. What to compare against:\n   - Supervisor, shift, and department → the Req Tracker or Flex Q (Flex Q is imported from the Req Tracker, so they should match)\n   - Wage, pay frequency, markup, Light Industrial code, primary org, agency, and Contingent Kronos ID area → these are the standard values for the Flex account. Anything that doesn't match the account standard is wrong.\n5. Tip: sort or filter one column at a time. Blanks and values that don't match the rest (for example, a different wage or markup than others in the same job) stand out quickly.\n6. Correct anything that is wrong or blank in Workday.\n7. Re-run the report to confirm your corrections show up.\n8. In the Audit Tracker, enter the Bold ID of each associate you corrected (the Workday report doesn't show Bold IDs, so look each one up in Avionte Bold) and note which field was wrong and what you changed it to." },
  { slot: "1", name: "Audit Prep List", detail: "Contact all associates on the Prep List to find out if they are still interested in waiting for a position. If they are not, remove their row. If they are, update the column showing how many times we've contacted them and the Last Contacted date column. Also contact anyone who has been prepped but has not attended a Mini Orientation — everyone on the Prep List should have attended one.", sop: "Where files are kept: Flex/Axiom may use Box, SharePoint, OneDrive, or the extranet in Teams, depending on the site and its current process. Always use the one your site uses now.\n\n1. Open the Prep List spreadsheet.\n2. Start at the top and work through every associate on the list.\n3. Check whether each associate has attended a Mini Orientation. Everyone on the Prep List should have attended one.\n4. Call or text each associate and ask if they are still interested in waiting for a position at Flex.\n5. If they are NOT still interested, delete their row from the Prep List.\n6. If they ARE still interested:\n   - Add 1 to the column showing how many times we have contacted them.\n   - Update the Last Contacted date column to today's date.\n   - If they have been prepped but have NOT attended a Mini Orientation, ask them to attend the next one and add them to the Mini Orientation tab in Flex Q.\n7. If you could not reach them, still update the contact count and Last Contacted date, and leave a short note that there was no answer (and that they still need a Mini Orientation, if they do).\n8. In the Audit Tracker, enter notes describing what was completed (for example: how many associates were contacted, how many were removed, and how many still need a Mini Orientation)." },
  { slot: "2", name: "Headcount Accuracy", detail: "Ensure that the Flex headcount in the Workday Core HR - Contingent Worker Details report, the Flex Master Dashboard, and Avionte Bold all match. If anything does not match, find the discrepancy and correct it.", sop: "1. In Workday, run the Core HR - Contingent Worker Details report and note the current Flex headcount.\n2. Pull the current Flex headcount from Avionte Bold: Analyze tab → Active Consultants report → Company: Flex → Date Range: Today.\n3. Check the current headcount shown on the Flex Master Dashboard.\n4. Compare the Flex Master Dashboard headcount to the Core HR report headcount. These two must match.\n5. Compare the Avionte Bold headcount to both. If all three numbers match, the audit is complete.\n6. If they do not match, compare the name lists side by side to find which associates are missing or extra in each system.\n7. Common causes:\n   - The latest Core HR report has not been imported into the Flex Master Dashboard yet (import it the same way as in the New Hire Audit, steps 8–9)\n   - A termination that was done in one system but not the others\n   - A new hire that was not added everywhere yet\n   - A status in Avionte Bold that was not changed to On Assignment, Active, or Inactive\n8. Correct each discrepancy in the system that is wrong.\n9. Re-check all three numbers to confirm they now match.\n10. In the Audit Tracker, enter the Bold ID of each associate you corrected and note what was wrong and where." },
  { slot: "3", name: "New Hire Audit", detail: "Double check that all new hire documents were uploaded to your site's current file location (Box, SharePoint, OneDrive, or the extranet in Teams) in the New Starts folder for the current year (in Box: Agency Materials > New Hire Forms > YES > New Starts). Create a new folder for the start date of those associates if it does not already exist, and upload. Ensure new hires are transferred from Training Manager to their real supervisor on their 3rd day of work in Workday. Ensure all new hires have every required document uploaded to their Avionte Bold file — I-9, W4, DD, Flex Onboarding, Flex Assignment Acknowledgement Form, Candidate Screening Form, EMT Injury Reporting Agreement, Background Check, Drug Screen, and Offer Letter. If any are missing, note on the associate what's missing and get it fixed. Import the Core HR - Contingent Worker Details report from Workday into the Flex Master Dashboard to keep the worker list there up to date.", sop: "Where files are kept: Flex/Axiom may use Box, SharePoint, OneDrive, or the extranet in Teams, depending on the site and its current process. Always use the one your site uses now.\n\nFile Uploads:\n1. Open your site's current file location and go to the New Starts folder for the current year (in Box: Agency Materials → New Hire Forms → YES → New Starts (current year)).\n2. Confirm there is a folder for each start date from this week. If one is missing, create it, named with the start date.\n3. Confirm every new hire's documents are uploaded in the correct start date folder. Upload anything that is missing.\n\nWorkday Supervisor Transfer:\n4. In Workday, check every new hire who is on their 3rd day of work or later.\n5. Confirm they have been moved from Training Manager to their real supervisor. If not, transfer them.\n\nAvionte Bold File:\n6. Open each new hire's file in Avionte Bold and confirm all of these documents are uploaded:\n   - I-9\n   - W4\n   - DD (Direct Deposit or Rapid Card)\n   - Flex Onboarding\n   - Flex Assignment Acknowledgement Form\n   - Candidate Screening Form\n   - EMT Injury Reporting Agreement\n   - Background Check\n   - Drug Screen\n   - Offer Letter\n7. If anything is missing, leave a note on the associate's Avionte Bold file listing what is missing, and follow up until it is fixed.\n\nFlex Master Dashboard:\n8. In Workday, run the Core HR - Contingent Worker Details report and export it.\n9. Import that report into the Flex Master Dashboard so the worker list is up to date.\n\n10. In the Audit Tracker, enter the Bold ID of any new hire with missing items and note what was missing and what was done." },
  { slot: "4", name: "Terminations 100% Complete", detail: "Ensure all terms for the week are completely done. Run the Workday report for Terminations and, for any names that populate, find them in Avionte Bold and make sure they're fully termed. If they are not, term them: enter their last day worked as the End Date on their assignment, then add a Logged Activity, choose Termination, and type your notes. Make sure their status is changed from On Assignment. Then check the End of Assignment sheet in your site's current file location (Box, SharePoint, OneDrive, or the extranet in Teams) and be sure it was completed there, check the Flex Master Dashboard and be sure it was done there, and check that the email was sent to security to deactivate the badge.", sop: "Where files are kept: Flex/Axiom may use Box, SharePoint, OneDrive, or the extranet in Teams, depending on the site and its current process. Always use the one your site uses now.\n\n1. In Workday, run the Terminations report for this week.\n2. For every name on the report, complete steps 3 through 8.\n3. Find the associate in Avionte Bold and confirm they are fully termed. Fully termed means all three of these are done:\n   - Their assignment has an End Date (their last day worked).\n   - Their Logged Activity has a Termination entry.\n   - Their status is no longer On Assignment.\n4. If the End Date or Termination entry is missing, fix it now:\n   - Open their assignment and enter their last day worked as the End Date. Save it.\n   - Go to their Logged Activity, add a new activity, choose Termination, and type your notes about the termination.\n5. If their status is still On Assignment, change it:\n   - Still looking for work → Active\n   - Found a job elsewhere or not returning → Inactive\n   To change the status: open the associate's profile, hover over their picture in the top left, click the edit button (pencil and notepad), choose Talent Status, change it, and click the blue save icon.\n6. Open the End of Assignment sheet in your site's current file location and confirm the termination was entered there.\n7. Open the Flex Master Dashboard and confirm the termination was entered there.\n8. Confirm the email was sent to security to deactivate the associate's badge. If it was not sent, send it now.\n9. In the Audit Tracker, enter the Bold ID of any associate where something was missing and note what you fixed." },
  { slot: "5", name: "Absenteeism Tracker & Employee SSN Tab on Payroll Tracker", detail: "Ensure that all data for the prior week was completely filled out. If there are notes that say pending supervisor approval or something similar, reach out to the person who entered the note and ask them to update it and let you know when it's done.", sop: "Where files are kept: Flex/Axiom may use Box, SharePoint, OneDrive, or the extranet in Teams, depending on the site and its current process. Always use the one your site uses now.\n\nAbsenteeism Tracker:\n1. Open the Absenteeism Tracker and go to the prior week.\n2. Confirm every row for that week has all required columns filled in.\n3. Look for notes like \"pending supervisor approval\" or anything else that is not final.\n\nEmployee SSN Tab on Payroll Tracker:\n4. Open the Payroll Tracker and go to the Employee SSN tab.\n5. Confirm every row for the prior week is completely filled out.\n\nFollow Up:\n6. For anything incomplete or pending, reach out to the person who entered it and ask them to update it and let you know once it's done.\n7. Once they confirm, re-check that it was actually updated.\n8. In the Audit Tracker, enter notes describing what was incomplete and who you followed up with." },
  { slot: "fixed", name: "I-9's", detail: "Check that all active associates have an accurate and complete I-9 in Avionte Bold. Every document must have been unexpired on the day the I-9 was signed — an expired document can't be accepted. If a List A document has expired since then and the associate is not a U.S. citizen, it needs to be replaced (follow the EAD guide).", sop: "Section 1 — Employee Information and Attestation:\n1. Confirm the name is in the correct order and matches the ID document presented — as much of the employee's legal name as the system allows.\n2. Confirm the address is a current, valid physical address that makes sense for the job assignment. Double-check anything listing an out-of-state address for accuracy.\n3. Confirm the Date of Birth matches the ID presented.\n4. Confirm the Social Security Number is filled in and valid (9 digits) — do not accept invalid SSNs. The SSN is required on our I-9s because YES uses E-Verify.\n5. Confirm exactly one citizenship/immigration status box is checked:\n   - If box 3 (lawful permanent resident) is checked, confirm the USCIS or A-Number is filled in.\n   - If box 4 (noncitizen authorized to work until) is checked, confirm the expiration date is filled in if their work permit has one. 'N/A' is only correct when the work permit has no end date (for example, some refugees and asylees). Also confirm one of these is filled in: USCIS/A-Number, Form I-94 number, or foreign passport number and country.\n   - Confirm any A-Numbers entered are valid.\n6. Note: Middle Initial, Other Names Used, Email, and Phone Number are NOT required fields — they can be complete, partial, or blank. Do not flag these as errors.\n\nSection 2 — Employer Review and Verification:\n7. Confirm the document(s) listed match what was actually presented — Title, Issuing Authority, Document #, and Expiration Date.\n8. Confirm expiration dates are only filled in when the document itself lists one — should be left blank if the document doesn't expire.\n9. If a List A document is an I-94, confirm it was presented together with an unexpired foreign passport.\n10. If a List C document is an I-94 presented without a foreign passport, confirm a List B ID was also collected.\n11. Confirm the First Day of Employment matches the date the associate was entered into the applicant pool.\n12. If anything was corrected, confirm no white-out was used. The correct method is a single line drawn through the incorrect information, with the correct information written next to it, initialed and dated. A short explanation can be added in the Additional Information section. Only the associate may correct Section 1 — if Section 1 has an error, have the associate fix it.\n\nAcceptable Documents (List A / B / C):\n13. Confirm the documentation presented is an acceptable combination: one selection from List A, OR one from List B AND one from List C.\n14. Every document with an expiration date must have been unexpired on the day the I-9 was signed (unless extended by the issuing authority). An expired document can't be accepted. If a List A document has expired since then and the associate is not a U.S. citizen, it needs to be replaced — follow the EAD guide.\n15. If a receipt was presented instead of an original document, confirm it's a valid receipt type (replacement for a lost/stolen/damaged List A, B, or C document, or a qualifying I-94/refugee stamp) and check the M-274 (USCIS Handbook for Employers) for receipt validity dates.\n\n16. Once reviewed, enter the associate's Bold ID and your audit notes (what was checked, any corrections made) in the Audit Tracker.", image: I9_IMAGE },
  { slot: "fixed", name: "W4's", detail: "Check the W4 for errors, and make sure anyone claiming Exempt turns in a new W4 every year by February 15 (last year's exempt W4 is still valid until then).", sop: "1. Pull the active list from Avionte Bold: Analyze tab → Active Consultants report → Company: Flex → Date Range: Today. Then open each associate's W4 in their Avionte Bold file.\n2. Confirm it is the 2020 or newer version of the W4.\n3. Step 1 (Personal Information) must be complete:\n   - Full name\n   - Address\n   - Social Security Number\n   - One filing status box checked (Single or Married filing separately, Married filing jointly or Qualifying surviving spouse, or Head of household)\n4. Steps 2, 3, and 4 are optional. Leaving them blank is not an error.\n5. If Step 3 (dependents) is filled in, confirm the amounts are written as numbers and the total is added up.\n6. Step 5 must be signed and dated by the associate. An unsigned W4 is not valid.\n7. If the associate claimed \"Exempt\": an exempt W4 expires every year on February 15. From January 1 to February 15, last year's exempt W4 is still valid. After February 15, confirm a new W4 was signed this year — if one was not turned in, withholding must switch to Single (or Married filing separately) with no adjustments until a new W4 is received.\n8. Confirm the name and SSN match the associate's I-9.\n9. If anything is missing or wrong, have the associate fill out a new W4. Do not correct it for them.\n10. In the Audit Tracker, enter the Bold ID of any associate whose W4 needed fixing and note what was wrong." },
  { slot: "fixed", name: "DD", detail: "Ensure each active associate has a Direct Deposit or Rapid Card account set up. If nothing is set up, send the task to the associate or send them to a YES branch for a Rapid Card. Paper checks are for emergencies only.", sop: "1. Pull the active list from Avionte Bold: Analyze tab → Active Consultants report → Company: Flex → Date Range: Today.\n2. Open each associate's file and confirm they have either a Direct Deposit account or a Rapid Card set up.\n3. If nothing is set up, either:\n   - Send the Direct Deposit task to the associate to complete, or\n   - Send them to a YES branch to get a Rapid Card.\n   Paper checks are for emergencies only — Direct Deposit and Rapid Card are the standard choices.\n4. Follow up to help them choose a pay method. Never hold back an associate's pay because Direct Deposit or a Rapid Card is not set up.\n5. In the Audit Tracker, enter the Bold ID of each associate without pay set up and note what you sent them or where you sent them." }
];

// Null-prototype maps so user-typed keys like "constructor" or "__proto__" are plain data.
function dict(){ return Object.create(null); }
function own(obj, key){ return obj && Object.prototype.hasOwnProperty.call(obj, key) ? obj[key] : undefined; }
function isPlainObject(v){ return !!v && typeof v === "object" && !Array.isArray(v); }

function writeStorage(key, value){
  try{ window.localStorage.setItem(key, value); return true; } catch(e){ return false; }
}
function readStorage(key){
  try{ return window.localStorage.getItem(key); } catch(e){ return null; }
}

// ---------- Dates (all calendar math in UTC days to avoid daylight-saving drift) ----------

function isoFromParts(y, m, d){ return `${y}-${String(m + 1).padStart(2,"0")}-${String(d).padStart(2,"0")}`; }
function todayIso(){ const d = new Date(); return isoFromParts(d.getFullYear(), d.getMonth(), d.getDate()); }
function isoToUtc(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
  if(!m) return NaN;
  const d = new Date(0);
  d.setUTCFullYear(+m[1], +m[2] - 1, +m[3]);
  return d.getUTCMonth() === +m[2] - 1 ? d.getTime() : NaN;
}
function utcToIso(t){ const d = new Date(t); return isoFromParts(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); }
function addDays(iso, n){ return utcToIso(isoToUtc(iso) + n * DAY_MS); }
function mondayOf(iso){ const t = isoToUtc(iso); return utcToIso(t - ((new Date(t).getUTCDay() + 6) % 7) * DAY_MS); }
function weekNumberFor(iso, startIso){ return Math.floor((isoToUtc(iso) - isoToUtc(startIso)) / (7 * DAY_MS)) + 1; }
function currentWeekNumber(){ return Math.max(1, weekNumberFor(todayIso(), state.config.weekOneStart)); }
function weekStart(n){ return addDays(state.config.weekOneStart, (n - 1) * 7); }
function formatDay(iso, withYear){
  const d = new Date(isoToUtc(iso));
  return `${MONTHS[d.getUTCMonth()]} ${d.getUTCDate()}${withYear ? ", " + d.getUTCFullYear() : ""}`;
}
function weekRangeLabel(n){ const s = weekStart(n); return `${formatDay(s, false)} – ${formatDay(addDays(s, 6), true)}`; }
function weekLabel(n){ return `Week ${n} (${weekRangeLabel(n)})`; }
function formatStamp(iso){
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "";
  return d.toLocaleString(undefined, { month:"short", day:"numeric", year:"numeric", hour:"numeric", minute:"2-digit" });
}

// ---------- Setup / state ----------

function defaultConfig(weekOneStart){
  return {
    title: "Weekly Audits",
    subtitle: "Flex Onsite Team",
    sidebarTitle: "Flex Audits",
    passNote: "Pass = 80% or better",
    weekOneStart: weekOneStart || mondayOf(todayIso()),
    rotatingPeople: [...ROTATING_PEOPLE],
    displayOrder: [...DISPLAY_ORDER],
    audits: [...DEFAULT_AUDITS],
    fixedPerson: FIXED_PERSON,
    fixedAudit: FIXED_AUDIT,
    legendItems: LEGEND_ITEMS.map(item => ({ name: item.name, image: item.image ? item.name : null }))
  };
}

function normalizeConfig(cfg, fallbackStart){
  const defaults = defaultConfig(fallbackStart);
  const src = isPlainObject(cfg) ? cfg : {};
  const out = {};
  ["title","subtitle","sidebarTitle","passNote","fixedPerson","fixedAudit"].forEach(k => {
    out[k] = typeof src[k] === "string" ? src[k] : defaults[k];
  });
  if(!out.fixedPerson.trim()) out.fixedPerson = defaults.fixedPerson;
  if(!out.fixedAudit.trim()) out.fixedAudit = defaults.fixedAudit;
  out.weekOneStart = typeof src.weekOneStart === "string" && !isNaN(isoToUtc(src.weekOneStart)) ? src.weekOneStart : defaults.weekOneStart;
  ["rotatingPeople","displayOrder","audits"].forEach(k => {
    const list = Array.isArray(src[k]) ? Array.from(new Set(src[k].filter(v => typeof v === "string" && v.trim()))) : null;
    out[k] = list && list.length ? list : defaults[k];
  });
  out.rotatingPeople = out.rotatingPeople.filter(p => p !== out.fixedPerson);
  if(!out.rotatingPeople.length) out.rotatingPeople = defaults.rotatingPeople.filter(p => p !== out.fixedPerson);
  const seenLegend = new Set();
  out.legendItems = Array.isArray(src.legendItems)
    ? src.legendItems.filter(i => isPlainObject(i) && typeof i.name === "string" && i.name.trim() && !seenLegend.has(i.name) && seenLegend.add(i.name))
        .map(i => ({ name: i.name, image: typeof i.image === "string" ? i.image : null }))
    : defaults.legendItems;
  return out;
}

function parseBoldIds(text){
  const seen = new Set();
  const out = [];
  String(text || "").split(/[\s,;]+/).forEach(part => {
    const id = part.trim().toUpperCase();
    if(id && !seen.has(id)){ seen.add(id); out.push(id); }
  });
  return out;
}

function emptyResult(){ return { status: null, verified: false, note: "", boldIds: [], by: "", at: "", correctedBy: "", correctedAt: "" }; }

function isEmptyResult(r){ return !r.status && !r.verified && !r.note.trim() && !r.boldIds.length; }

function sanitizeResult(val){
  if(typeof val === "string"){
    val = val === "Manager Verified" ? { verified: true } : { status: val };
  }
  if(!isPlainObject(val)) return null;
  const r = {
    status: val.status === "Pass" || val.status === "Fail" ? val.status : null,
    verified: val.verified === true,
    note: typeof val.note === "string" ? val.note : "",
    boldIds: Array.isArray(val.boldIds)
      ? parseBoldIds(val.boldIds.filter(x => typeof x === "string").join(" "))
      : parseBoldIds(typeof val.boldId === "string" ? val.boldId : ""),
    by: typeof val.by === "string" ? val.by : "",
    at: typeof val.at === "string" ? val.at : "",
    correctedBy: "",
    correctedAt: ""
  };
  // Corrected only means something on a Fail.
  if(r.status === "Fail" && typeof val.correctedAt === "string" && val.correctedAt){
    r.correctedAt = val.correctedAt;
    r.correctedBy = typeof val.correctedBy === "string" ? val.correctedBy : "";
  }
  return isEmptyResult(r) ? null : r;
}

// A raw entry that held nothing (so dropping it loses no data, and needs no damaged copy).
function isBlankRawResult(val){
  if(val === null || val === undefined || val === "") return true;
  if(!isPlainObject(val)) return false;
  const hasText = v => typeof v === "string" && v.trim() !== "";
  return !val.status && !val.verified && !hasText(val.note) && !hasText(val.boldId)
    && !(Array.isArray(val.boldIds) && val.boldIds.some(hasText));
}

function migrateLegendKeys(map){
  Object.keys(LEGEND_NAME_MIGRATIONS).forEach(oldName => {
    if(own(map, oldName) === undefined) return;
    const newName = LEGEND_NAME_MIGRATIONS[oldName];
    if(!(own(map, newName) || "").trim()) map[newName] = map[oldName];
    delete map[oldName];
  });
}

function applyContentRefresh(map, refreshTable, field){
  Object.keys(refreshTable).forEach(name => {
    if(refreshTable[name].includes(own(map, name))){
      const item = LEGEND_ITEMS.find(i => i.name === name);
      if(item && item[field]) map[name] = item[field];
    }
  });
}

// Version 3 (2026-10-08): the E-Verify audit was replaced by the Core HR report audit.
// Weeks already recorded are frozen first so their history still says Everify.
function migrateEverifyToCoreHr(config, results, weekSnapshots, auditDetails, sopDetails){
  const OLD_SLOT = "Bold Status & EAD's & Everify";
  const OLD_ITEM = "Everify";
  const historyConfig = { ...config, audits: config.audits.map(a => a === "Bold Status & EAD's & Core HR Report" ? OLD_SLOT : a) };
  Object.keys(results).forEach(wk => {
    if(!own(weekSnapshots, wk)) weekSnapshots[wk] = computeAssignments(Number(wk), historyConfig);
  });
  if(!config.audits.includes("Bold Status & EAD's & Core HR Report")){
    config.audits = config.audits.map(a => a === OLD_SLOT ? "Bold Status & EAD's & Core HR Report" : a);
  }
  const item = LEGEND_ITEMS.find(i => i.name === "Audit Core HR Report");
  if(config.legendItems.some(i => i.name === OLD_ITEM) && !config.legendItems.some(i => i.name === item.name)){
    config.legendItems = config.legendItems.map(i => i.name === OLD_ITEM ? { name: item.name, image: null } : i);
  }
  if(!config.legendItems.some(i => i.name === OLD_ITEM)){
    delete auditDetails[OLD_ITEM];
    delete sopDetails[OLD_ITEM];
  }
  if(config.legendItems.some(i => i.name === item.name)){
    if(own(auditDetails, item.name) === undefined) auditDetails[item.name] = item.detail;
    if(!(own(sopDetails, item.name) || "").trim()) sopDetails[item.name] = item.sop;
  }
}

// Accepts anything that was ever saved (or imported) and returns a clean state.
// Bad weeks/entries are dropped one at a time instead of discarding everything.
function sanitizeState(parsed){
  if(!isPlainObject(parsed) || !(isPlainObject(parsed.results) || isPlainObject(parsed.config))){
    throw new Error("Not a tracker save");
  }
  const legacy = !isPlainObject(parsed.config);
  let dropped = 0;
  let latestRecorded = 0;

  const results = dict();
  if(isPlainObject(parsed.results)){
    Object.keys(parsed.results).forEach(wkKey => {
      const wk = Number(wkKey);
      const weekRaw = parsed.results[wkKey];
      if(!Number.isInteger(wk) || wk < 1 || wk > MAX_WEEK || !isPlainObject(weekRaw)){ dropped++; return; }
      const week = dict();
      const keys = Object.keys(weekRaw);
      const isOldName = k => legacy && own(NAME_MIGRATIONS, k) !== undefined;
      // Legacy real names migrate to role codes; an entry already under the code wins.
      keys.filter(k => !isOldName(k)).concat(keys.filter(isOldName)).forEach(person => {
        const key = isOldName(person) ? NAME_MIGRATIONS[person] : person;
        if(own(week, key) !== undefined) return;
        const r = sanitizeResult(weekRaw[person]);
        if(r) week[key] = r;
        else if(!isBlankRawResult(weekRaw[person])) dropped++;
      });
      if(Object.keys(week).length){
        results[wk] = week;
        latestRecorded = Math.max(latestRecorded, wk);
      }
    });
  }

  const weekSnapshots = dict();
  if(isPlainObject(parsed.weekSnapshots)){
    Object.keys(parsed.weekSnapshots).forEach(wkKey => {
      const wk = Number(wkKey);
      const rows = parsed.weekSnapshots[wkKey];
      if(!Number.isInteger(wk) || wk < 1 || wk > MAX_WEEK || !Array.isArray(rows)){ dropped++; return; }
      const clean = rows.filter(r => isPlainObject(r) && typeof r.person === "string" && typeof r.audit === "string")
        .map(r => ({ person: r.person, audit: r.audit, fixed: r.fixed === true }));
      if(clean.length) weekSnapshots[wk] = clean;
    });
  }

  const reassignments = dict();
  if(isPlainObject(parsed.reassignments)){
    Object.keys(parsed.reassignments).forEach(wkKey => {
      const wk = Number(wkKey);
      const raw = parsed.reassignments[wkKey];
      if(!Number.isInteger(wk) || wk < 1 || wk > MAX_WEEK || !isPlainObject(raw)){ dropped++; return; }
      const week = dict();
      Object.keys(raw).forEach(person => {
        const c = raw[person];
        if(isPlainObject(c) && typeof c.to === "string" && c.to.trim()){
          week[person] = {
            to: c.to.trim(),
            reason: typeof c.reason === "string" ? c.reason.trim() : "",
            by: typeof c.by === "string" ? c.by : "",
            at: typeof c.at === "string" ? c.at : ""
          };
        } else dropped++;
      });
      if(Object.keys(week).length) reassignments[wk] = week;
    });
  }

  const textMap = src => {
    const out = dict();
    if(isPlainObject(src)) Object.keys(src).forEach(k => { if(typeof src[k] === "string") out[k] = src[k]; });
    return out;
  };
  const auditDetails = textMap(parsed.auditDetails);
  const sopDetails = textMap(parsed.sopDetails);
  if(legacy){
    migrateLegendKeys(auditDetails);
    migrateLegendKeys(sopDetails);
  }
  applyContentRefresh(auditDetails, LEGEND_CONTENT_REFRESH, "detail");
  applyContentRefresh(sopDetails, SOP_CONTENT_REFRESH, "sop");

  // Older saves only had a week counter. Anchor it so the latest week in use is "this week".
  const thisMonday = mondayOf(todayIso());
  let fallbackStart = thisMonday;
  if(legacy || isNaN(isoToUtc(parsed.config.weekOneStart))){
    const savedWeek = Number.isInteger(parsed.currentWeek) && parsed.currentWeek > 0 && parsed.currentWeek <= MAX_WEEK ? parsed.currentWeek : 1;
    fallbackStart = addDays(thisMonday, -(Math.max(savedWeek, latestRecorded) - 1) * 7);
  }
  const config = normalizeConfig(parsed.config, fallbackStart);

  // The fixed row can't be reassigned, and a role can't cover itself.
  Object.keys(reassignments).forEach(wk => {
    const week = reassignments[wk];
    Object.keys(week).forEach(person => {
      const lower = person.toLowerCase();
      if(person === config.fixedPerson || week[person].to.toLowerCase() === lower){ delete week[person]; dropped++; }
    });
    if(!Object.keys(week).length) delete reassignments[wk];
  });

  if(legacy){
    LEGEND_ITEMS.forEach(item => {
      if(own(auditDetails, item.name) === undefined) auditDetails[item.name] = item.detail;
      if(item.sop && !(own(sopDetails, item.name) || "").trim()) sopDetails[item.name] = item.sop;
    });
  }

  if(!(parsed.version >= 3)) migrateEverifyToCoreHr(config, results, weekSnapshots, auditDetails, sopDetails);

  return { state: { version: 3, results, weekSnapshots, reassignments, auditDetails, sopDetails, config }, dropped };
}

function freshState(){
  const auditDetails = dict();
  const sopDetails = dict();
  LEGEND_ITEMS.forEach(item => {
    auditDetails[item.name] = item.detail;
    if(item.sop) sopDetails[item.name] = item.sop;
  });
  return { version: 3, results: dict(), weekSnapshots: dict(), reassignments: dict(), auditDetails, sopDetails, config: defaultConfig() };
}

function loadState(){
  let raw;
  try{
    raw = window.localStorage.getItem(STORAGE_KEY);
  } catch(e){
    state = freshState();
    showError("This browser is blocking saved data, so nothing you enter will be kept after you close this tab. Open the tracker in a normal (not private) browser window, or ask your manager for help.");
    return;
  }
  if(!raw){ state = freshState(); return; }
  try{
    const { state: clean, dropped } = sanitizeState(JSON.parse(raw));
    state = clean;
    if(dropped){
      if(writeStorage(STORAGE_KEY + "-damaged-copy-" + Date.now(), raw)){
        showError(`Some saved entries were damaged and couldn't be shown (${dropped} skipped). Everything else loaded normally, and a copy of the original data was kept in this browser. Please tell your manager.`);
        saveState();
      } else {
        saveBlocked = true;
        showError(`Some saved entries were damaged and couldn't be shown (${dropped} skipped). ${SAVE_BLOCKED_MSG}`, "save-blocked");
      }
      return;
    }
    saveState();
  } catch(e){
    const kept = writeStorage(STORAGE_KEY + "-unreadable-copy-" + Date.now(), raw);
    state = freshState();
    if(kept){
      showError("Your saved tracker data couldn't be read, so the tracker started fresh. A copy of the old data was kept in this browser. Tell your manager before entering new results so it can be recovered — or restore a backup file from Edit Setup.");
    } else {
      saveBlocked = true;
      showError(`Your saved tracker data couldn't be read. ${SAVE_BLOCKED_MSG}`, "save-blocked");
    }
  }
}

function saveState(){
  if(saveBlocked){
    showError(`Nothing was saved. ${SAVE_BLOCKED_MSG}`, "save-blocked");
    return false;
  }
  if(!writeStorage(STORAGE_KEY, JSON.stringify(state))){
    showError("Couldn't save on this computer — the browser's storage may be full or turned off. Keep this tab open and tell your manager so nothing is lost.");
    return false;
  }
  return true;
}

function userName(){ return (readStorage(USER_NAME_KEY) || "").trim(); }

// ---------- Assignments ----------

function sortForDisplay(assignments){
  const order = state.config.displayOrder;
  const rank = person => { const i = order.indexOf(person); return i < 0 ? order.length : i; };
  return [...assignments].sort((a, b) => {
    if(a.fixed) return 1;
    if(b.fixed) return -1;
    return rank(a.person) - rank(b.person);
  });
}

function computeAssignments(weekNumber, cfg){
  const offset = (weekNumber - 1) % cfg.audits.length;
  const rotating = cfg.rotatingPeople.map((person, i) => {
    const auditIdx = (i + offset) % cfg.audits.length;
    return { person, audit: cfg.audits[auditIdx], fixed:false };
  });
  return [...rotating, { person: cfg.fixedPerson, audit: cfg.fixedAudit, fixed:true }];
}

// Weeks with recorded results are frozen into weekSnapshots when the setup changes,
// so editing roles/audits never rewrites what someone was assigned in the past.
function assignmentsForWeek(weekNumber){
  const snap = own(state.weekSnapshots, weekNumber);
  return snap ? snap.map(a => ({...a})) : computeAssignments(weekNumber, state.config);
}

function weekResults(wk){ return own(state.results, wk) || dict(); }
function reassignmentFor(wk, person){ return own(own(state.reassignments, wk), person) || null; }
function coverText(c){ return c ? `Covered by ${c.to}${c.reason ? " (" + c.reason + ")" : ""}` : ""; }

// ---------- Small UI helpers ----------

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function initials(name){
  const words = name.trim().split(/\s+/).filter(Boolean);
  const chars = words.length > 1 ? [Array.from(words[0])[0], Array.from(words[1])[0]] : Array.from(words[0] || "?").slice(0, 2);
  return chars.join("").toUpperCase();
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => t.classList.remove("show"), 4000);
}

function showError(msg, kind){
  const bar = document.getElementById("errorBar");
  document.getElementById("errorText").textContent = msg;
  bar.dataset.kind = kind || "";
  document.getElementById("errorExport").hidden = kind !== "save-blocked";
  bar.hidden = false;
}

function clearError(kind){
  const bar = document.getElementById("errorBar");
  if(bar.dataset.kind === kind) bar.hidden = true;
}

function focusByKey(key){
  const el = Array.from(document.querySelectorAll("[data-focus-key]")).find(e => e.dataset.focusKey === key);
  if(el && !el.disabled){ el.focus(); return true; }
  return false;
}

function guideName(){ return activeView.startsWith("guide:") ? activeView.slice(6) : null; }
function hasGuide(name){ return state.config.legendItems.some(i => i.name === name); }

function editBannerHtml(){
  if(!editMode) return "";
  return `
    <div class="edit-banner" role="status">
      <span><strong>Edit mode is on.</strong> Changes are saved in this browser. Click Lock Editing when you're done.</span>
      <button type="button" class="btn-ghost btn-small" data-action="lock-editing">Lock Editing</button>
    </div>`;
}

// ---------- Rendering ----------

function render(){
  const active = document.activeElement;
  const focusKey = active && active.dataset ? active.dataset.focusKey : null;
  document.title = state.config.title.trim() || "Weekly Audits";
  renderSidebar();
  if(activeView === "setup" && editMode){
    renderSetupView();
  } else if(guideName() !== null && hasGuide(guideName())){
    renderGuideView();
  } else {
    activeView = "tracker";
    renderTrackerView();
  }
  if(focusKey) focusByKey(focusKey);
}

function renderSidebar(){
  const navButton = (view, labelHtml, extraClass) => {
    const active = activeView === view;
    return `<button type="button" class="sidebar-item ${extraClass || ''} ${active ? 'active' : ''}" ${active ? 'aria-current="page"' : ''} data-action="nav" data-view="${escapeHtml(view)}" data-focus-key="${escapeHtml("nav:" + view)}">${labelHtml}</button>`;
  };
  document.getElementById("sidebar").innerHTML = `
    <div class="sidebar-title">${escapeHtml(state.config.sidebarTitle)}</div>
    ${navButton("tracker", "Weekly Tracker")}
    ${editMode ? navButton("setup", "Edit Setup", "setup-item") : ""}
    <div class="sidebar-divider"></div>
    <div class="sidebar-title">How-To Guides</div>
    ${state.config.legendItems.map(item => {
      const hasDetail = !!(own(state.sopDetails, item.name) || "").trim();
      return navButton("guide:" + item.name, `<span class="dot" aria-hidden="true"></span>${escapeHtml(item.name)}`, hasDetail ? "has-detail" : "");
    }).join("")}
    <div class="sidebar-divider"></div>
    <button type="button" class="sidebar-item edit-toggle" data-action="toggle-edit" data-focus-key="edit-toggle">${editMode ? "Lock Editing" : "Edit Mode"}</button>
  `;
}

function computeBoldIdOccurrences(){
  const map = new Map();
  Object.keys(state.results).map(Number).sort((a,b) => a - b).forEach(wk => {
    const res = weekResults(wk);
    Object.keys(res).forEach(person => {
      res[person].boldIds.forEach(id => {
        if(!map.has(id)) map.set(id, []);
        map.get(id).push({ week: wk, person });
      });
    });
  });
  return map;
}

function computeRepeatFlags(){
  return Array.from(computeBoldIdOccurrences())
    .filter(([, occurrences]) => occurrences.length > 1)
    .map(([boldId, occurrences]) => ({ boldId, occurrences }))
    .sort((a,b) => b.occurrences.length - a.occurrences.length);
}

function weekLinkHtml(wk, extraText){
  return `<button type="button" class="link-btn" data-action="jump-week" data-week="${wk}">Week ${wk}${extraText ? " (" + escapeHtml(extraText) + ")" : ""}</button>`;
}

function repeatFlagsHtml(){
  const flags = computeRepeatFlags();
  if(!flags.length) return "";
  return `
    <section class="alert-section" aria-labelledby="flagsHeading">
      <h2 class="panel-heading flags-heading" id="flagsHeading">Repeat Flags — same Bold ID found more than once</h2>
      <div class="card-panel flags-panel">
        ${flags.map(({boldId, occurrences}) => `
          <div class="flag-item">
            <div class="flag-id">Bold ID ${escapeHtml(boldId)}</div>
            <div class="flag-occurrences">
              Found ${occurrences.length} times: ${occurrences.map(o => weekLinkHtml(o.week, o.person)).join(", ")}
            </div>
          </div>
        `).join("")}
      </div>
    </section>`;
}

function isUncorrectedFail(r){ return r.status === "Fail" && !r.correctedAt; }

function correctionText(r){
  if(r.status !== "Fail") return "";
  return r.correctedAt
    ? `Corrected${r.correctedBy ? " by " + r.correctedBy : ""} · ${formatStamp(r.correctedAt)}`
    : "Not corrected yet";
}

function passRateRows(){
  const last = currentWeekNumber();
  const first = Math.max(1, last - PASS_RATE_WEEKS + 1);
  const byAudit = new Map();
  for(let wk = first; wk <= last; wk++){
    const res = weekResults(wk);
    assignmentsForWeek(wk).forEach(({person, audit}) => {
      const r = own(res, person);
      if(!r || !r.status) return;
      if(!byAudit.has(audit)) byAudit.set(audit, { audit, passed: 0, failed: 0, uncorrected: 0 });
      const row = byAudit.get(audit);
      if(r.status === "Pass") row.passed++; else row.failed++;
      if(isUncorrectedFail(r)) row.uncorrected++;
    });
  }
  const rows = Array.from(byAudit.values()).map(row => ({ ...row, rate: row.passed / (row.passed + row.failed) }));
  rows.sort((a,b) => a.rate - b.rate || b.failed - a.failed || a.audit.localeCompare(b.audit));
  return { first, last, rows };
}

function passRatesHtml(){
  const { first, last, rows } = passRateRows();
  if(!rows.length) return "";
  const span = last === first ? `Week ${first}` : `Weeks ${first}–${last}`;
  return `
    <section class="rates" aria-labelledby="ratesHeading">
      <h2 class="panel-heading" id="ratesHeading">Pass Rates by Audit — ${span}</h2>
      <div class="card-panel">
        <p class="panel-intro">Covers the last ${PASS_RATE_WEEKS} weeks and counts only audits with a Pass or Fail recorded. The audits failing most often are listed first.</p>
        <div class="rates-scroll">
        <table class="rates-table">
          <thead><tr><th scope="col">Audit</th><th scope="col" class="num">Passed</th><th scope="col" class="num">Failed</th><th scope="col" class="num">Pass Rate</th><th scope="col" class="num">Not Corrected</th></tr></thead>
          <tbody>
            ${rows.map(row => `<tr>
              <td>${escapeHtml(row.audit)}</td>
              <td class="num">${row.passed}</td>
              <td class="num">${row.failed}</td>
              <td class="num ${row.rate < 0.75 ? "rate-low" : ""}">${Math.round(row.rate * 100)}%</td>
              <td class="num">${row.uncorrected}</td>
            </tr>`).join("")}
          </tbody>
        </table>
        </div>
      </div>
    </section>`;
}

function overdueWeeks(){
  const recordedWeeks = Object.keys(state.results).map(Number);
  if(!recordedWeeks.length) return [];
  const first = Math.min(...recordedWeeks);
  const list = [];
  for(let wk = currentWeekNumber() - 1; wk >= first; wk--){
    const res = weekResults(wk);
    const missing = sortForDisplay(assignmentsForWeek(wk))
      .filter(a => { const r = own(res, a.person); return !r || !r.status; })
      .map(a => { const c = reassignmentFor(wk, a.person); return c ? `${a.person} (covered by ${c.to})` : a.person; });
    if(missing.length) list.push({ week: wk, missing });
  }
  return list;
}

function overdueHtml(){
  const weeks = overdueWeeks();
  if(!weeks.length) return "";
  const shown = weeks.slice(0, OVERDUE_LIST_LIMIT);
  const hiddenCount = weeks.length - shown.length;
  return `
    <section class="alert-section" aria-labelledby="overdueHeading">
      <h2 class="panel-heading overdue-heading" id="overdueHeading">Overdue Audits</h2>
      <div class="card-panel overdue-panel">
        <p class="panel-intro">These past weeks still have audits with no Pass or Fail recorded. Click a week to open it.</p>
        ${shown.map(({week, missing}) => `
          <div class="flag-item">
            ${weekLinkHtml(week, weekRangeLabel(week))}
            <div class="flag-occurrences">Not recorded: ${missing.map(escapeHtml).join(", ")}</div>
          </div>
        `).join("")}
        ${hiddenCount ? `<p class="panel-intro">…and ${hiddenCount} older week${hiddenCount === 1 ? "" : "s"}.</p>` : ""}
      </div>
    </section>`;
}

function weekYear(wk){ return weekStart(wk).slice(0, 4); }

function isYearOpen(year, newestYear){ return openHistoryYears ? openHistoryYears.has(year) : year === newestYear; }

function toggleHistoryYear(year, newestYear){
  if(!openHistoryYears) openHistoryYears = new Set([newestYear]);
  if(openHistoryYears.has(year)) openHistoryYears.delete(year); else openHistoryYears.add(year);
  render();
  focusByKey("year:" + year);
}

function historyHtml(){
  const weekNumbers = Object.keys(state.results).map(Number).filter(wk => wk !== viewWeek).sort((a,b) => b - a);
  if(!weekNumbers.length) return "";
  let body;
  if(showOlderWeeks){
    const years = [];
    weekNumbers.forEach(wk => {
      const y = weekYear(wk);
      if(!years.length || years[years.length - 1].year !== y) years.push({ year: y, weeks: [] });
      years[years.length - 1].weeks.push(wk);
    });
    const newestYear = years[0].year;
    body = years.map(({year, weeks}) => {
      const open = isYearOpen(year, newestYear);
      return `
        <button type="button" class="history-year" data-action="toggle-year" data-year="${year}" data-newest="${newestYear}" data-focus-key="year:${year}" aria-expanded="${open}">
          <span aria-hidden="true">${open ? "▾" : "▸"}</span> ${year} <span class="history-year-count">· ${weeks.length} week${weeks.length === 1 ? "" : "s"}</span>
        </button>
        ${open ? weeks.map(historyBlockHtml).join("") : ""}`;
    }).join("");
  } else {
    body = weekNumbers.slice(0, RECENT_HISTORY_WEEKS).map(historyBlockHtml).join("");
  }
  return `
    <section class="history" aria-labelledby="historyHeading">
      <h2 class="panel-heading" id="historyHeading">Past Weeks — click a week to open it</h2>
      <div class="card-panel">
        ${body}
      </div>
      ${weekNumbers.length > RECENT_HISTORY_WEEKS ? `
        <div class="history-more">
          <button type="button" class="btn-ghost btn-small" data-action="toggle-older" data-focus-key="toggle-older">${showOlderWeeks ? "Show Only Recent Weeks" : `Show All ${weekNumbers.length} Past Weeks (by year)`}</button>
        </div>` : ""}
    </section>`;
}

function historyBlockHtml(wk){
  const res = weekResults(wk);
  const assignments = sortForDisplay(assignmentsForWeek(wk));
  const recorded = assignments.filter(a => own(res, a.person));
  const pending = assignments.filter(a => { const r = own(res, a.person); return !r || !r.status; }).length;
  return `
    <div class="history-block">
      <button type="button" class="history-week" data-action="jump-week" data-week="${wk}" data-focus-key="hist:${wk}">${escapeHtml(weekLabel(wk))}</button>
      ${recorded.map(({person, audit}) => {
        const r = own(res, person);
        const cover = reassignmentFor(wk, person);
        const statusClass = r.status === "Pass" ? "pass" : r.status === "Fail" ? "fail" : "pending";
        const statusText = r.status === "Pass" ? "Pass" : r.status === "Fail" ? "Fail" : "No result";
        return `
          <div class="history-row">
            <span class="h-person">${escapeHtml(person)}${cover ? ` <span class="h-cover">covered by ${escapeHtml(cover.to)}</span>` : ""}</span>
            <span class="h-audit">${escapeHtml(audit)}</span>
            <span class="h-result ${statusClass}">${statusText}${r.status === "Fail" ? (r.correctedAt ? ' <span class="h-corrected">· Corrected</span>' : ' <span class="h-uncorrected">· Not corrected</span>') : ''}${r.verified ? ' <span class="h-verified">+ Verified</span>' : ''}</span>
          </div>
          ${r.boldIds.length ? `<div class="h-note"><strong>Bold IDs:</strong> ${escapeHtml(r.boldIds.join(", "))}</div>` : ''}
          ${r.note.trim() ? `<div class="h-note">${escapeHtml(r.note.trim())}</div>` : ''}`;
      }).join("")}
      ${pending ? `<div class="h-pending">${pending} audit${pending === 1 ? "" : "s"} with no Pass or Fail</div>` : ""}
    </div>`;
}

function legendHtml(){
  const items = state.config.legendItems;
  if(!items.length && !editMode) return "";
  return `
    <section class="legend" aria-labelledby="legendHeading">
      <h2 class="panel-heading" id="legendHeading">Audit Legend — quick summaries</h2>
      <div class="card-panel">
        ${items.length ? items.map(item => {
          const detail = (own(state.auditDetails, item.name) || "").trim();
          return `
            <div class="legend-item">
              <div class="legend-text">
                <div class="legend-name">${escapeHtml(item.name)}</div>
                <div class="legend-detail">${detail ? escapeHtml(detail) : `<span class="legend-empty">No summary added yet.${editMode ? " Click Edit to add one." : ""}</span>`}</div>
              </div>
              ${editMode ? `<button type="button" class="edit-btn" data-action="edit-legend" data-name="${escapeHtml(item.name)}" data-focus-key="${escapeHtml("legend:" + item.name)}" aria-label="Edit summary for ${escapeHtml(item.name)}">Edit</button>` : ''}
            </div>`;
        }).join("") : `<div class="legend-item"><span class="legend-empty">No audits in the legend yet. Add them on the Edit Setup page.</span></div>`}
      </div>
    </section>`;
}

  const failCount = assignments.filter(a => resultFor(a.person).status === "Fail").length;
  const uncorrectedCount = assignments.filter(a => isUncorrectedFail(resultFor(a.person))).length;
  const name = userName();

  const rows = assignments.map(({person, audit, fixed}) => {

    const stamp = r.at ? `Last updated${r.by ? " by " + escapeHtml(r.by) : ""} · ${escapeHtml(formatStamp(r.at))}` : "";
    const correction = correctionText(r);
    const cover = fixed ? null : reassignmentFor(wk, person);
    return `
      <div class="a-row ${fixed ? 'fixed' : ''}">
        <div class="a-avatar" aria-hidden="true">${fixed ? "ALL" : escapeHtml(initials(person))}</div>
        <div class="a-body">
          <div class="a-name">${p}${fixed ? ' <span class="a-fixed-tag">· every week</span>' : ''}</div>
          <div class="a-audit">${escapeHtml(audit)}</div>
          ${cover ? `<div class="a-cover">Covered by <strong>${escapeHtml(cover.to)}</strong>${cover.reason ? " · " + escapeHtml(cover.reason) : ""}</div>` : ''}
          ${stamp ? `<div class="a-stamp">${stamp}</div>` : ''}

          ${chip("Pass", "Pass", "pass", r.status === "Pass")}

          ${editMode && !fixed ? `<button type="button" class="a-chip reassign-btn" data-action="open-reassign" data-person="${p}" data-focus-key="${escapeHtml("reassign:" + person)}">${cover ? "Change Reassignment" : "Reassign"}</button>` : ''}

  }).join("");

  document.getElementById("mainContent").innerHTML = `
    ${editBannerHtml()}
    <div class="page-header">
      <div>
        <h1>${escapeHtml(cfg.title)}</h1>
        ${cfg.subtitle.trim() ? `<div class="sub">${escapeHtml(cfg.subtitle)}</div>` : ''}
      </div>
      <div class="week-nav">
        <div class="week-nav-row">
          <button type="button" class="week-arrow" data-action="week-prev" data-focus-key="week-prev" aria-label="Previous week" title="Previous week" ${wk <= 1 ? 'disabled' : ''}>&#8592;</button>
          <div class="week-badge" aria-live="polite">Week ${wk}</div>
          <button type="button" class="week-arrow" data-action="week-next" data-focus-key="week-next" aria-label="Next week" title="Next week" ${wk >= thisWeek ? 'disabled' : ''}>&#8594;</button>
        </div>
        <div class="week-dates">${escapeHtml(weekRangeLabel(wk))} ·
          ${wk === thisWeek ? '<span class="this-week-tag">This week</span>' : `<button type="button" class="link-btn" data-action="week-today" data-focus-key="week-today">Go to This Week</button>`}
        </div>
      </div>
    </div>
    <div class="toolbar">
      <div class="toolbar-left">
        ${cfg.passNote.trim() ? `<span class="pass-note">${escapeHtml(cfg.passNote)}</span>` : ''}
        ${name
          ? `<span class="recording-as">Recording as <strong>${escapeHtml(name)}</strong> · <button type="button" class="link-btn" data-action="set-name" data-focus-key="set-name">Change</button></span>`
          : `<span class="recording-as name-missing">Add your name so results show who recorded them. <button type="button" class="link-btn" data-action="set-name" data-focus-key="set-name">Add Your Name</button></span>`}
      </div>
      <button type="button" class="btn-ghost btn-small" data-action="print-week" data-focus-key="print-week">Print This Week</button>
    </div>

      <div class="stat-card"><div class="stat-n">${recordedCount}/${assignments.length}</div><div class="stat-l">Recorded</div></div>
      <div class="stat-card"><div class="stat-n">${passCount}</div><div class="stat-l">Passed</div></div>
      <div class="stat-card"><div class="stat-n">${failCount}</div><div class="stat-l">Failed</div>${failCount ? `<div class="stat-sub ${uncorrectedCount ? "" : "ok"}">${uncorrectedCount ? uncorrectedCount + " not corrected yet" : "All corrected"}</div>` : ""}</div>
