// ---------- Results & notes ----------

function stampResult(r){
  r.by = userName();
  r.at = new Date().toISOString();
}

function storeResult(wk, person, r){
  if(isEmptyResult(r)){
    const res = own(state.results, wk);
    if(res){
      delete res[person];
      if(!Object.keys(res).length) delete state.results[wk];
    }
  } else {
    if(!own(state.results, wk)) state.results[wk] = dict();
    state.results[wk][person] = r;
  }
}

function setResult(person, type, confirmed){
  const wk = viewWeek;
  if(wk > currentWeekNumber()) return;
  const before = own(weekResults(wk), person) || emptyResult();
  const r = { ...before };
  r.boldIds = [...r.boldIds];
  if(type === "Manager Verified") r.verified = !r.verified;
  else if(type === "Corrected"){
    if(r.status !== "Fail") return;
    const nowCorrected = !r.correctedAt;
    r.correctedAt = nowCorrected ? new Date().toISOString() : "";
    r.correctedBy = nowCorrected ? userName() : "";
  }
  else r.status = r.status === type ? null : type;
  if(r.status !== "Fail"){ r.correctedAt = ""; r.correctedBy = ""; }
  if(before.correctedAt && !r.correctedAt && !confirmed){
    confirmRemoveCorrection(wk, person, type, before);
    return;
  }
  stampResult(r);
  storeResult(wk, person, r);
  saveState();
  render();
}

function confirmRemoveCorrection(wk, person, type, before){
  pendingResultChange = { week: wk, person, type };
  const who = before.correctedBy ? ` by ${before.correctedBy}` : "";
  const what = type === "Corrected" ? "Un-marking it" : type === "Fail" ? "Clearing the Fail result" : `Changing the result to ${type}`;
  openModal(modalShell("uncorrectTitle", `
    <h3 id="uncorrectTitle">Remove the correction?</h3>
    <p class="modal-help">${escapeHtml(person)}'s failed audit for Week ${wk} was marked corrected${escapeHtml(who)} on ${escapeHtml(formatStamp(before.correctedAt))}. ${escapeHtml(what)} will erase that record.</p>
    <div class="modal-actions">
      <button type="button" class="btn-ghost" data-action="modal-cancel">Keep the Correction</button>
      <button type="button" class="btn-danger" data-action="confirm-result-change">Remove Correction</button>
    </div>
  `, true));
}

function applyPendingResultChange(){
  const change = pendingResultChange;
  pendingResultChange = null;
  closeModal();
  if(!change || change.week !== viewWeek) return;
  setResult(change.person, change.type, true);
  showToast("Correction removed");
}

function changeWeek(delta){
  goToWeek(viewWeek + delta);
}

function goToWeek(n, scrollTop){
  const target = Math.min(Math.max(1, n), currentWeekNumber());
  viewWeek = target;
  activeView = "tracker";
  render();
  if(scrollTop){
    window.scrollTo({ top: 0 });
    showToast("Now showing " + weekLabel(target));
  }
}

function modalConfirmHtml(){
  return `
    <div class="modal-confirm" id="modalConfirm" hidden>
      <strong>Close without saving?</strong> What you typed will be lost.
      <div class="modal-actions">
        <button type="button" class="btn-ghost btn-small" data-action="modal-keep">Keep Editing</button>
        <button type="button" class="btn-danger btn-small" data-action="modal-force-close">Close Without Saving</button>
      </div>
    </div>`;
}

function modalShell(labelId, inner, narrow){
  return `
    <div class="modal-overlay" id="modalOverlay" data-action="modal-backdrop">
      <div class="modal-box ${narrow ? 'modal-narrow' : ''}" role="dialog" aria-modal="true" aria-labelledby="${labelId}">
        ${inner}
      </div>
    </div>`;
}

function openNoteEditor(person){
  const wk = viewWeek;
  noteTarget = { week: wk, person };
  const r = own(weekResults(wk), person) || emptyResult();
  const assignment = assignmentsForWeek(wk).find(a => a.person === person);
  const initialIds = r.boldIds.join(", ");
  const initialNote = r.note;
  openModal(modalShell("noteTitle", `
    <h3 id="noteTitle">${escapeHtml(person)} — ${escapeHtml(assignment ? assignment.audit : "Audit")}</h3>
    <div class="modal-sub">${escapeHtml(weekLabel(wk))}${reassignmentFor(wk, person) ? " · " + escapeHtml(coverText(reassignmentFor(wk, person))) : ""}</div>
    <label class="field-label" for="noteBoldIds">Bold IDs</label>
    <input type="text" id="noteBoldIds" class="modal-input" autocomplete="off" placeholder="e.g. 10234567, 10234568" value="${escapeHtml(initialIds)}" aria-describedby="boldIdHelp boldIdMatches">
    <div class="field-hint" id="boldIdHelp">Separate more than one Bold ID with commas.</div>
    <div class="match-warning" id="boldIdMatches" aria-live="polite"></div>
    <label class="field-label" for="noteText">Note</label>
    <textarea id="noteText" placeholder="e.g. 2 associates had the wrong supervisor in Workday (Bold IDs above). Corrected same day.">${escapeHtml(initialNote)}</textarea>
    ${modalConfirmHtml()}
    <div class="modal-actions">
      <button type="button" class="btn-ghost" data-action="modal-cancel">Cancel</button>
      <button type="button" class="btn-primary" data-action="save-note">Save Note</button>
    </div>
  `), {
    isDirty: () => document.getElementById("noteBoldIds").value !== initialIds || document.getElementById("noteText").value !== initialNote
  });
  document.getElementById("noteBoldIds").addEventListener("input", updateBoldIdMatches);
  updateBoldIdMatches();
}

// Phase two of Repeat Flags: warn while typing if a Bold ID was recorded in another week/row.
function updateBoldIdMatches(){
  const input = document.getElementById("noteBoldIds");
  const box = document.getElementById("boldIdMatches");
  if(!input || !box || !noteTarget) return;
  const occurrences = computeBoldIdOccurrences();
  const lines = [];
  parseBoldIds(input.value).forEach(id => {
    const others = (occurrences.get(id) || []).filter(o => !(o.week === noteTarget.week && o.person === noteTarget.person));
    if(others.length) lines.push(`${id} was already recorded in ${others.map(o => `Week ${o.week} (${o.person})`).join(", ")}.`);
  });
  box.innerHTML = lines.length
    ? `<strong>Heads up — this Bold ID has come up before:</strong><ul>${lines.map(l => `<li>${escapeHtml(l)}</li>`).join("")}</ul>`
    : "";
}

function saveNote(){
  if(!noteTarget) return;
  const { week, person } = noteTarget;
  const r = { ...(own(weekResults(week), person) || emptyResult()) };
  r.note = document.getElementById("noteText").value;
  r.boldIds = parseBoldIds(document.getElementById("noteBoldIds").value);
  stampResult(r);
  storeResult(week, person, r);
  noteTarget = null;
  saveState();
  closeModal();
  render();
  showToast(`Note saved for ${person}, Week ${week}`);
}

// ---------- Reassigning an audit (Edit Mode, one week only) ----------

// The "Someone else" option is marked with data-other, so a role with any name can't collide with it.
function reassignOtherChosen(){
  const sel = document.getElementById("reassignTo");
  return !!(sel.selectedOptions[0] && sel.selectedOptions[0].dataset.other);
}
function reassignChoiceKey(){
  return reassignOtherChosen() ? "\u0000other" : document.getElementById("reassignTo").value;
}

function openReassign(person){
  if(!editMode) return;
  const wk = viewWeek;
  const assignment = assignmentsForWeek(wk).find(a => a.person === person);
  if(!assignment || assignment.fixed) return;
  const current = reassignmentFor(wk, person);
  const roles = state.config.displayOrder.filter(p => p !== person);
  const initialIsOther = !!current && !roles.includes(current.to);
  const initialChoice = initialIsOther ? "\u0000other" : current ? current.to : "";
  const initialOther = initialIsOther ? current.to : "";
  const initialReason = current ? current.reason : "";
  reassignTarget = { week: wk, person };
  openModal(modalShell("reassignTitle", `
    <h3 id="reassignTitle">Reassign ${escapeHtml(person)}'s audit</h3>
    <div class="modal-sub">${escapeHtml(assignment.audit)} · ${escapeHtml(weekLabel(wk))}</div>
    <p class="modal-help">Use this when someone is out. It only changes this one week — next week's rotation stays the same. The result still counts for this audit, and "Last updated" shows who recorded it.</p>
    <label class="field-label" for="reassignTo">Who is covering? <span aria-hidden="true">*</span></label>
    <select id="reassignTo" class="modal-input" aria-required="true" aria-describedby="reassignError">
      <option value="">Choose a team role…</option>
      ${roles.map(r => `<option value="${escapeHtml(r)}" ${!initialIsOther && r === initialChoice ? "selected" : ""}>${escapeHtml(r)}</option>`).join("")}
      <option value="" data-other="1" ${initialIsOther ? "selected" : ""}>Someone else (type their name)</option>
    </select>
    <div id="reassignOtherWrap" ${initialIsOther ? "" : "hidden"}>
      <label class="field-label" for="reassignOther">Their name <span aria-hidden="true">*</span></label>
      <input type="text" id="reassignOther" class="modal-input" autocomplete="off" value="${escapeHtml(initialOther)}" data-enter-action="save-reassign" aria-describedby="reassignError">
    </div>
    <div class="field-error" id="reassignError"></div>
    <label class="field-label" for="reassignReason">Reason (optional)</label>
    <input type="text" id="reassignReason" class="modal-input" autocomplete="off" placeholder="e.g. Out sick" value="${escapeHtml(initialReason)}" data-enter-action="save-reassign">
    <p class="field-hint required-note"><span aria-hidden="true">*</span> Required</p>
    ${modalConfirmHtml()}
    <div class="modal-actions">
      ${current ? `<button type="button" class="btn-ghost undo-reassign" data-action="undo-reassign">Undo Reassign</button>` : ""}
      <button type="button" class="btn-ghost" data-action="modal-cancel">Cancel</button>
      <button type="button" class="btn-primary" data-action="save-reassign">Save Reassignment</button>
    </div>
  `, true), {
    focus: "#reassignTo",
    isDirty: () => reassignChoiceKey() !== initialChoice
      || document.getElementById("reassignOther").value !== initialOther
      || document.getElementById("reassignReason").value !== initialReason
  });
}

function updateReassignOther(){
  const other = reassignOtherChosen();
  document.getElementById("reassignOtherWrap").hidden = !other;
  document.getElementById("reassignError").textContent = "";
  if(other) document.getElementById("reassignOther").focus();
}

function saveReassign(){
  if(!reassignTarget || !editMode) return;
  const { week, person } = reassignTarget;
  const isOther = reassignOtherChosen();
  const otherInput = document.getElementById("reassignOther");
  const to = isOther ? otherInput.value.trim() : document.getElementById("reassignTo").value;
  const error = document.getElementById("reassignError");
  const problem = !to
    ? (isOther ? "Type the name of the person covering, then click Save Reassignment." : "Choose who is covering this audit, then click Save Reassignment.")
    : to.toLowerCase() === person.toLowerCase() ? `${person} already has this audit. Pick someone else to cover it.`
    : to.toLowerCase() === state.config.fixedPerson.toLowerCase() ? "Pick one team role or one person to cover this audit."
    : "";
  if(problem){
    error.textContent = problem;
    (isOther ? otherInput : document.getElementById("reassignTo")).focus();
    return;
  }
  if(!own(state.reassignments, week)) state.reassignments[week] = dict();
  state.reassignments[week][person] = {
    to,
    reason: document.getElementById("reassignReason").value.trim(),
    by: userName(),
    at: new Date().toISOString()
  };
  reassignTarget = null;
  const saved = saveState();
  closeModal();
  render();
  if(saved) showToast(`Week ${week}: ${person}'s audit is now covered by ${to}`);
}

function undoReassign(){
  if(!reassignTarget || !editMode) return;
  const { week, person } = reassignTarget;
  const weekMap = own(state.reassignments, week);
  if(weekMap){
    delete weekMap[person];
    if(!Object.keys(weekMap).length) delete state.reassignments[week];
  }
  reassignTarget = null;
  const saved = saveState();
  closeModal();
  render();
  if(saved) showToast(`Week ${week}: ${person} is back on their own audit`);
}

function openNamePrompt(){
  const current = userName();
  openModal(modalShell("nameTitle", `
    <h3 id="nameTitle">Who is using this computer?</h3>
    <p class="modal-help">Your name is saved on this computer only. It's added to every result you record, so everyone can see who recorded what and when.</p>
    <label class="field-label" for="nameInput">Your name <span aria-hidden="true">*</span></label>
    <input type="text" id="nameInput" class="modal-input" autocomplete="name" value="${escapeHtml(current)}" data-enter-action="save-name" aria-describedby="nameError" aria-required="true">
    <div class="field-error" id="nameError"></div>
    <div class="modal-actions">
      <button type="button" class="btn-ghost" data-action="modal-cancel">Cancel</button>
      <button type="button" class="btn-primary" data-action="save-name">Save Name</button>
    </div>
  `, true));
}

function saveName(){
  const input = document.getElementById("nameInput");
  const name = input.value.trim();
  if(!name){
    document.getElementById("nameError").textContent = "Type your name, then click Save Name.";
    input.classList.add("input-error");
    input.focus();
    return;
  }
  if(!writeStorage(USER_NAME_KEY, name)){
    document.getElementById("nameError").textContent = "This browser couldn't save your name. Ask your manager for help.";
    return;
  }
  closeModal();
  render();
  showToast(`Thanks, ${name} — your results will show your name`);
}

// ---------- Printing ----------

function buildPrintArea(){
  const wk = viewWeek;
  const res = weekResults(wk);
  const rows = sortForDisplay(assignmentsForWeek(wk)).map(({person, audit}) => {
    const r = own(res, person) || emptyResult();
    const cover = reassignmentFor(wk, person);
    return `<tr>
      <td>${escapeHtml(person)}${cover ? "<br>" + escapeHtml(coverText(cover)) : ""}</td>
      <td>${escapeHtml(audit)}</td>
      <td>${r.status ? escapeHtml(r.status) : "Not recorded"}${r.status === "Fail" ? "<br>" + escapeHtml(correctionText(r)) : ""}</td>
      <td>${r.verified ? "Yes" : "No"}</td>
      <td>${escapeHtml(r.boldIds.join(", "))}</td>
      <td>${escapeHtml(r.note.trim())}</td>
      <td>${r.at ? escapeHtml((r.by ? r.by + ", " : "") + formatStamp(r.at)) : ""}</td>
    </tr>`;
  }).join("");

// ---------- Modals ----------

function openModal(html, opts){
  const active = document.activeElement;
  modal = {
    isDirty: (opts && opts.isDirty) || (() => false),
    returnFocus: active,
    returnKey: active && active.dataset ? active.dataset.focusKey : null
  };
  document.getElementById("modalRoot").innerHTML = html;
  const box = document.querySelector("#modalOverlay .modal-box");
  const first = box.querySelector((opts && opts.focus) || "input, textarea, button");
  if(first) first.focus();
}

function closeModal(){
  if(!modal) return;
  const { returnFocus, returnKey } = modal;
  modal = null;
  document.getElementById("modalRoot").innerHTML = "";
  if(returnKey && focusByKey(returnKey)) return;
  if(returnFocus && returnFocus.isConnected) returnFocus.focus();
}

function requestCloseModal(){
  if(modal && modal.isDirty()){
    const confirmBox = document.getElementById("modalConfirm");
    if(confirmBox){
      confirmBox.hidden = false;
      confirmBox.querySelector("button").focus();
      return;
    }
  }
  closeModal();
}

function hideModalConfirm(){
  const confirmBox = document.getElementById("modalConfirm");
  if(confirmBox) confirmBox.hidden = true;
  const first = document.querySelector("#modalOverlay .modal-box input, #modalOverlay .modal-box textarea");
  if(first) first.focus();
}

function trapModalFocus(e){
  const box = document.querySelector("#modalOverlay .modal-box");
  if(!box) return;
  const focusables = Array.from(box.querySelectorAll("button, input, textarea, select, a[href]"))
    .filter(el => !el.disabled && el.offsetParent !== null);
  if(!focusables.length) return;
  const first = focusables[0];
  const last = focusables[focusables.length - 1];
  if(!box.contains(document.activeElement)){
    e.preventDefault();
    first.focus();
  } else if(e.shiftKey && document.activeElement === first){
    e.preventDefault();
    last.focus();
  } else if(!e.shiftKey && document.activeElement === last){
    e.preventDefault();
    first.focus();
  }
}

function openGuard(action){
  pendingGuardAction = action;
  openModal(modalShell("guardTitle", `
    <h3 id="guardTitle">You have unsaved changes</h3>
    <p class="modal-help">If you continue, the changes you made on this page will be lost. To keep them, click Keep Editing and then Save.</p>
    <div class="modal-actions">
      <button type="button" class="btn-ghost" data-action="modal-cancel">Keep Editing</button>
      <button type="button" class="btn-danger" data-action="guard-discard">Discard Changes</button>
    </div>
  `));
}

function confirmGuardDiscard(){
  const action = pendingGuardAction;
  pendingGuardAction = null;
  setupDirty = false;
  editingGuide = false;
  closeModal();
  if(action) action();
}

function hasUnsavedEdits(){
  if(activeView === "setup" && setupDirty) return true;
  if(editingGuide){
    const ta = document.getElementById("guideText");
    return !!ta && ta.value !== ta.defaultValue;
  }
  return false;
}

function guardNavigation(action){
  if(hasUnsavedEdits()) openGuard(action);
  else action();
}

function setActiveView(view){
  if(view === activeView && !editingGuide) return;
  guardNavigation(() => {
    activeView = view;
    editingGuide = false;
    setupDraft = null;
    setupDirty = false;
    setupErrors = {};
    if(view === "tracker") viewWeek = Math.min(viewWeek, currentWeekNumber());
    render();
    window.scrollTo({ top: 0 });
  });
}

function markSetupDirty(message){
  setupDirty = true;
  const status = document.getElementById("setupStatus");
  if(status){
    status.textContent = message || "You have unsaved changes.";
    status.classList.add("dirty");
  }
  const discard = document.querySelector('[data-action="setup-discard"]');
  if(discard) discard.disabled = false;
}

function handleSetupInput(input){
  if(input.dataset.field){
    setupDraft[input.dataset.field] = input.value;
    if(input.dataset.field === "weekOneStart"){
      const hint = document.getElementById("weekOneHint");
      const valid = !isNaN(isoToUtc(input.value));
      const wk = valid ? weekNumberFor(todayIso(), input.value) : null;
      if(hint) hint.textContent = wk && wk >= 1 ? `With this date, today is in Week ${wk}.` : "";
    }
  } else if(input.dataset.fixed){
    setupDraft[input.dataset.fixed].name = input.value;
  } else if(input.dataset.list){
    setupDraft[input.dataset.list][Number(input.dataset.idx)].name = input.value;
  } else {
    return;
  }
  markSetupDirty();
}

function showFieldError(key){
  const input = document.querySelector(`[data-err-key="${key}"]`);
  const div = document.getElementById("err-" + key);
  const msg = setupErrors[key] || "";
  if(div && div.textContent !== msg) div.textContent = msg;
  if(input){
    input.classList.toggle("input-error", !!msg);
    if(msg) input.setAttribute("aria-invalid", "true"); else input.removeAttribute("aria-invalid");
  }
}

function validateFieldOnBlur(input){
  const key = input.dataset.errKey;
  if(!key) return;
  const all = validateSetupDraft();
  if(all[key]) setupErrors[key] = all[key]; else delete setupErrors[key];
  showFieldError(key);
}

function moveSetupItem(listKey, idx, dir){
  const list = setupDraft[listKey];
  const target = idx + dir;
  if(target < 0 || target >= list.length) return;
  [list[idx], list[target]] = [list[target], list[idx]];
  setupErrors = {};
  setupDirty = true;
  renderSetupView();
  if(!focusByKey(`move:${listKey}:${target}:${dir}`)) focusByKey(`move:${listKey}:${target}:${-dir}`);
}

function removeSetupItem(listKey, idx){
  setupDraft[listKey].splice(idx, 1);
  setupErrors = {};
  setupDirty = true;
  renderSetupView();
  const remaining = document.querySelectorAll(`input[data-list="${listKey}"]`);
  const next = remaining[Math.min(idx, remaining.length - 1)];
  if(next) next.focus(); else focusByKey("add:" + listKey);
  markSetupDirty("Removed — click Save Changes to make it final, or Discard Changes to undo.");
}

function addSetupItem(listKey){
  setupDraft[listKey].push({ orig: null, name: "", image: null });
  setupErrors = {};
  setupDirty = true;
  renderSetupView();
  const inputs = document.querySelectorAll(`input[data-list="${listKey}"]`);

    <div class="modal-actions">

      <button type="button" class="btn-danger" data-action="setup-discard-confirm">Discard Changes</button>
    </div>
  `, true));

function discardSetupChanges(){
  closeModal();
  setupDraft = null;
  setupDirty = false;
  setupErrors = {};
  renderSetupView();
  showToast("Changes discarded");
}

function validateSetupDraft(){
  const errors = {};
  const d = setupDraft;
  if(!d.title.trim()) errors["field-title"] = "Enter a page title.";
  if(isNaN(isoToUtc(d.weekOneStart))) errors["field-weekOneStart"] = "Pick the date Week 1 started.";
  else if(d.weekOneStart > todayIso()) errors["field-weekOneStart"] = "Week 1 can't start in the future. Pick today or an earlier date.";
  else if(d.weekOneStart < "2020-01-01") errors["field-weekOneStart"] = "That date is too far in the past. Check the year — it should have 4 digits, like 2026.";
  else {
    const latest = Math.max(0, ...Object.keys(state.results).concat(Object.keys(state.reassignments)).map(Number));
    const todayWeek = weekNumberFor(todayIso(), d.weekOneStart);
    if(latest > todayWeek){
      errors["field-weekOneStart"] = `Results or reassignments are already saved for Week ${latest}, but with this date today would only be Week ${todayWeek}. Pick ${formatDay(addDays(todayIso(), -(latest - 1) * 7), true)} or an earlier date.`;
    }
  }
  if(!d.fixedPerson.name.trim()) errors["fixed-fixedPerson"] = "Enter who does the weekly audit (for example, Everyone).";
  if(!d.fixedAudit.name.trim()) errors["fixed-fixedAudit"] = "Enter the name of the weekly audit.";
  const fixedPersonLower = d.fixedPerson.name.trim().toLowerCase();

  Object.keys(SETUP_LISTS).forEach(listKey => {
    const seen = new Map();
    d[listKey].forEach((it, idx) => {
      const name = it.name.trim();
      const lower = name.toLowerCase();
      const key = `${listKey}-${idx}`;
      if(!name){
        errors[key] = "Enter a name, or click Remove to delete this row.";
      } else if(seen.has(lower)){
        errors[key] = `This name is already used in row ${seen.get(lower) + 1}. Each name must be different.`;
      } else if(listKey === "people" && lower === fixedPersonLower){
        errors[key] = `"${name}" is already used for the weekly audit for everyone. Pick a different name.`;
      } else {
        seen.set(lower, idx);
      }
    });
  });
  if(!d.people.length) errors.people = "Add at least one team role.";
  if(!d.audits.length) errors.audits = "Add at least one rotating audit.";

  // A role can't take over a name that already has saved results belonging to someone else
  // (for example a role removed earlier) — that would silently merge or overwrite history.
  const historyNames = new Set();
  Object.keys(state.results).forEach(wk => Object.keys(state.results[wk]).forEach(p => historyNames.add(p)));
  Object.keys(state.weekSnapshots).forEach(wk => state.weekSnapshots[wk].forEach(r => historyNames.add(r.person)));
  Object.keys(state.reassignments).forEach(wk => Object.keys(state.reassignments[wk]).forEach(p => historyNames.add(p)));
  const personRows = d.people.map((row, i) => ({ row, key: `people-${i}` })).concat([{ row: d.fixedPerson, key: "fixed-fixedPerson" }]);
  const freed = new Set(personRows.filter(({row}) => row.orig !== null && row.orig !== row.name.trim()).map(({row}) => row.orig));
  personRows.forEach(({row, key}) => {
    const name = row.name.trim();
    if(errors[key] || !name || name === row.orig) return;
    if(historyNames.has(name) && !freed.has(name)){
      errors[key] = `"${name}" belongs to a role that was removed or renamed earlier and still has saved results. Pick a different name (for example "${name} 2") so the old results don't get mixed in.`;
    }
  });
  return errors;
}

function saveSetup(){
  setupErrors = validateSetupDraft();
  if(Object.keys(setupErrors).length){
    renderSetupView();
    const first = document.querySelector("#mainContent .input-error") || document.querySelector("#mainContent .field-error:not(:empty)");
    if(first){
      first.scrollIntoView({ block: "center" });
      if(first.tagName === "INPUT") first.focus();
    }
    const count = Object.keys(setupErrors).length;
    showError(`${count} item${count === 1 ? " needs" : "s need"} fixing before you can save — look for the red messages on the page.`, "setup-validation");
    return;
  }
  clearError("setup-validation");
  const d = setupDraft;
  const c = state.config;
  const removedNames = (list, current) => current.filter(orig => !list.some(it => it.orig === orig));
  const removed = [
    ...removedNames(d.people, c.rotatingPeople).map(n => `Team role "${n}"`),
    ...removedNames(d.audits, c.audits).map(n => `Rotating audit "${n}"`),
    ...removedNames(d.legend, c.legendItems.map(i => i.name)).map(n => `Legend & guide item "${n}" (its summary and How-To Guide will be deleted)`)
  ];
  const dateChanged = d.weekOneStart !== c.weekOneStart;
  if(!removed.length && !dateChanged){ applySetup(); return; }
  openModal(modalShell("removeTitle", `
    <h3 id="removeTitle">Please confirm these changes</h3>
    ${removed.length ? `<p class="modal-help">Saving will remove:</p>
      <ul class="remove-list">${removed.map(r => `<li>${escapeHtml(r)}</li>`).join("")}</ul>
      <p class="modal-help">Past weeks keep the results already recorded.</p>` : ""}
    ${dateChanged ? `<p class="modal-help">Week 1 will start on <strong>${escapeHtml(formatDay(d.weekOneStart, true))}</strong> instead of ${escapeHtml(formatDay(c.weekOneStart, true))}. Every week's dates will shift — today will be <strong>Week ${weekNumberFor(todayIso(), d.weekOneStart)}</strong> (it is Week ${currentWeekNumber()} now).</p>` : ""}
    <div class="modal-actions">
      <button type="button" class="btn-ghost" data-action="modal-cancel">Go Back</button>
      <button type="button" class="btn-danger" data-action="apply-setup">Save These Changes</button>
    </div>
  `));
}

function renameMap(list){
  const map = dict();
  list.forEach(it => { if(it.orig !== null && it.orig !== it.name.trim()) map[it.orig] = it.name.trim(); });
  return map;
}

function renameKeys(obj, map){
  const out = dict();
  Object.keys(obj).forEach(k => { if(own(map, k) === undefined) out[k] = obj[k]; });
  Object.keys(obj).forEach(k => { if(own(map, k) !== undefined) out[map[k]] = obj[k]; });
  return out;
}

function applySetup(){
  closeModal();
  const d = setupDraft;
  const old = state.config;

  Object.keys(state.results).concat(Object.keys(state.reassignments)).forEach(wk => {
    if(!own(state.weekSnapshots, wk)) state.weekSnapshots[wk] = computeAssignments(Number(wk), old);
  });

  const personMap = renameMap([...d.people, d.fixedPerson]);
  const auditMap = renameMap(d.audits);
  const fixedAuditMap = renameMap([d.fixedAudit]);
  Object.keys(state.results).forEach(wk => { state.results[wk] = renameKeys(state.results[wk], personMap); });
  Object.keys(state.reassignments).forEach(wk => {
    state.reassignments[wk] = renameKeys(state.reassignments[wk], personMap);
    Object.values(state.reassignments[wk]).forEach(c => { if(own(personMap, c.to) !== undefined) c.to = personMap[c.to]; });
  });
  Object.keys(state.weekSnapshots).forEach(wk => {
    state.weekSnapshots[wk].forEach(row => {
      if(own(personMap, row.person) !== undefined) row.person = personMap[row.person];
      const map = row.fixed ? fixedAuditMap : auditMap;
      if(own(map, row.audit) !== undefined) row.audit = map[row.audit];
    });
  });

  old.legendItems.map(i => i.name).filter(n => !d.legend.some(it => it.orig === n)).forEach(n => {
    delete state.auditDetails[n];
    delete state.sopDetails[n];
  });
  const legendMap = renameMap(d.legend);
  state.auditDetails = renameKeys(state.auditDetails, legendMap);
  state.sopDetails = renameKeys(state.sopDetails, legendMap);

  const keptRotation = old.rotatingPeople
    .map(orig => d.people.find(p => p.orig === orig))
    .filter(Boolean)
    .map(p => p.name.trim());
  const addedPeople = d.people.filter(p => p.orig === null).map(p => p.name.trim());

  state.config = {
    title: d.title.trim(),
    subtitle: d.subtitle.trim(),
    sidebarTitle: d.sidebarTitle.trim(),
    passNote: d.passNote.trim(),
    weekOneStart: d.weekOneStart,
    rotatingPeople: keptRotation.concat(addedPeople),
    displayOrder: d.people.map(p => p.name.trim()),
    audits: d.audits.map(a => a.name.trim()),
    fixedPerson: d.fixedPerson.name.trim(),
    fixedAudit: d.fixedAudit.name.trim(),
    legendItems: d.legend.map(it => ({ name: it.name.trim(), image: it.image || null }))
  };

  setupDraft = null;
  setupDirty = false;
  setupErrors = {};
  viewWeek = d.weekOneStart !== old.weekOneStart ? currentWeekNumber() : Math.min(viewWeek, currentWeekNumber());
  if(saveState()) showToast("Setup saved");
  render();
}

// ---------- Backup & restore ----------

function downloadText(filename, text){
  const blob = new Blob([text], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function exportBackup(){
  const exportedAt = new Date().toISOString();
  downloadText(`flex-audit-backup-${todayIso()}.json`, JSON.stringify({ app: "flex-audit-tracker", version: 3, exportedAt, data: state }, null, 2));
  writeStorage(LAST_BACKUP_KEY, exportedAt);
  const status = document.getElementById("backupStatus");
  if(status) status.textContent = "Last backup from this browser: " + formatStamp(exportedAt);
  showToast("Backup downloaded — keep the file somewhere safe, like a shared drive");
}

function exportRawData(){
  const raw = readStorage(STORAGE_KEY);
  if(!raw){ showError("There's no saved data in this browser to download."); return; }
  downloadText(`flex-audit-raw-data-${todayIso()}.json`, raw);
}

async function handleImportFile(input){
  const errorDiv = document.getElementById("err-import");
  errorDiv.textContent = "";
  const file = input.files && input.files[0];
  if(!file) return;
  if(file.size > MAX_IMPORT_BYTES){
    input.value = "";
    errorDiv.textContent = "That file is too big to be a tracker backup (over 5 MB). Pick a file that was made with Download Backup (its name starts with flex-audit-backup and ends in .json).";
    return;
  }
  input.disabled = true;
  const help = document.getElementById("importHelp");
  const helpText = help.textContent;
  help.textContent = "Reading the backup file…";
  try{
    const parsed = JSON.parse(await file.text());
    const data = isPlainObject(parsed) && parsed.app === "flex-audit-tracker" ? parsed.data : parsed;
    const { state: clean } = sanitizeState(data);
    const weeks = Object.keys(clean.results).length;
    pendingImport = clean;
    const when = isPlainObject(parsed) && typeof parsed.exportedAt === "string" ? formatStamp(parsed.exportedAt) : "";
    openModal(modalShell("importTitle", `
      <h3 id="importTitle">Restore this backup?</h3>
      <p class="modal-help">This replaces <strong>everything</strong> in this browser — all weeks, notes, guides, and setup — with the backup${when ? ` made on <strong>${escapeHtml(when)}</strong>` : ""}. The backup has results for ${weeks} week${weeks === 1 ? "" : "s"}.</p>
      <p class="modal-help">A safety copy of what's here now will be kept in this browser first.${setupDirty ? " Your unsaved changes on this page will also be discarded." : ""}</p>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" data-action="modal-cancel">Cancel</button>
        <button type="button" class="btn-danger" data-action="confirm-import">Replace With Backup</button>
      </div>
    `));
  } catch(e){
    pendingImport = null;
    errorDiv.textContent = "That file isn't a tracker backup, or it's damaged. Pick a file that was made with Download Backup (its name starts with flex-audit-backup and ends in .json).";
  } finally {
    input.disabled = false;
    input.value = "";
    help.textContent = helpText;
  }
}

function confirmImport(){
  if(!pendingImport) return;
  const restorePrefix = STORAGE_KEY + "-before-restore-";
  const restoreKey = restorePrefix + Date.now();
  const current = saveBlocked ? (readStorage(STORAGE_KEY) || JSON.stringify(state)) : JSON.stringify(state);
  if(!writeStorage(restoreKey, current)){
    closeModal();
    showError("Couldn't make a safety copy before restoring, so nothing was changed. The browser's storage may be full — ask your manager for help.");
    return;
  }
  try{
    Object.keys(window.localStorage).filter(k => k.startsWith(restorePrefix) && k !== restoreKey).forEach(k => window.localStorage.removeItem(k));
  } catch(e){}
  state = pendingImport;
  pendingImport = null;
  saveBlocked = false;
  clearError("save-blocked");
  setupDraft = null;
  setupDirty = false;
  setupErrors = {};
  viewWeek = currentWeekNumber();
  closeModal();
  if(saveState()) showToast("Backup restored");
  render();
}

// ---------- Event wiring ----------

const actions = {
  "nav": el => setActiveView(el.dataset.view),
  "toggle-edit": () => editMode ? lockEditing() : openPinPrompt(),
  "lock-editing": () => lockEditing(),
  "dismiss-error": () => { document.getElementById("errorBar").hidden = true; },
  "result": el => setResult(el.dataset.person, el.dataset.type),
  "open-note": el => openNoteEditor(el.dataset.person),
  "save-note": () => saveNote(),
  "week-prev": () => changeWeek(-1),
  "week-next": () => changeWeek(1),
  "week-today": () => goToWeek(currentWeekNumber()),
  "jump-week": el => goToWeek(Number(el.dataset.week), true),
  "toggle-older": () => { showOlderWeeks = !showOlderWeeks; render(); },
  "toggle-year": el => toggleHistoryYear(el.dataset.year, el.dataset.newest),
  "open-reassign": el => openReassign(el.dataset.person),
  "save-reassign": () => saveReassign(),
  "undo-reassign": () => undoReassign(),
  "print-week": () => printWeek(),
  "set-name": () => openNamePrompt(),
  "save-name": () => saveName(),
  "submit-pin": () => submitPin(),
  "edit-legend": el => openLegendItemEdit(el.dataset.name),
  "save-legend": () => saveLegendItem(),
  "edit-guide": () => startGuideEdit(),
  "cancel-guide": () => cancelGuideEdit(),
  "save-guide": () => saveGuideEdit(),
  "modal-backdrop": (el, e) => { if(e.target === el) requestCloseModal(); },
  "modal-cancel": () => requestCloseModal(),
  "modal-keep": () => hideModalConfirm(),
  "modal-force-close": () => closeModal(),
  "guard-discard": () => confirmGuardDiscard(),
  "setup-move": el => moveSetupItem(el.dataset.list, Number(el.dataset.idx), Number(el.dataset.dir)),
  "setup-remove": el => removeSetupItem(el.dataset.list, Number(el.dataset.idx)),
  "setup-add": el => addSetupItem(el.dataset.list),
  "setup-save": () => saveSetup(),
  "setup-discard": () => confirmDiscardSetup(),
  "setup-discard-confirm": () => discardSetupChanges(),
  "apply-setup": () => applySetup(),
  "export-backup": () => exportBackup(),
  "export-raw": () => exportRawData(),
  "confirm-import": () => confirmImport(),
  "confirm-result-change": () => applyPendingResultChange()
};

function safely(fn){
  try{ fn(); }
  catch(e){
    showError("Something went wrong with that action. Reload the page to see what was saved, then try again — if it keeps happening, tell your manager.");
  }
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if(!el || el.disabled) return;
  const fn = actions[el.dataset.action];
  if(fn) safely(() => fn(el, e));
});

document.addEventListener("keydown", e => {
  if(!modal) return;
  if(e.key === "Escape"){ e.preventDefault(); safely(requestCloseModal); return; }
  if(e.key === "Tab"){ trapModalFocus(e); return; }
  if(e.key === "Enter" && e.target.dataset && e.target.dataset.enterAction){
    e.preventDefault();
    const fn = actions[e.target.dataset.enterAction];
    if(fn) safely(() => fn(e.target, e));
  }
});

document.addEventListener("input", e => {
  if(activeView === "setup" && setupDraft && e.target.closest("#mainContent")) handleSetupInput(e.target);
});

document.addEventListener("focusout", e => {
  if(activeView === "setup" && setupDraft && e.target.dataset && e.target.dataset.errKey) validateFieldOnBlur(e.target);
});

document.addEventListener("change", e => {
  if(e.target.id === "importFile") handleImportFile(e.target);
  if(e.target.id === "reassignTo") safely(updateReassignOther);
});

window.addEventListener("beforeprint", () => { if(state) safely(buildPrintArea); });

window.addEventListener("beforeunload", e => {
  if(hasUnsavedEdits() || (modal && modal.isDirty())){ e.preventDefault(); e.returnValue = ""; }
});

function renderFatal(){
  document.getElementById("mainContent").innerHTML = `
    <div class="fatal" role="alert">
      <h1 style="font-size:22px;margin-top:0">The tracker couldn't open</h1>
      <p>Something in the saved data stopped the tracker from loading. Nothing has been deleted.</p>
      <p>Click the button below to download a copy of your data, then send that file to your manager so it can be fixed.</p>
      <button type="button" class="btn-primary" data-action="export-raw">Download a Copy of My Data</button>
    </div>`;
}

try{
  loadState();
  viewWeek = currentWeekNumber();
  render();
} catch(e){
  renderFatal();
}

})();
</script>
